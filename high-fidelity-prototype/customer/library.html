<!doctype html>
<!-- Declare the document as HTML5 -->

<html lang="en">
<!-- Root element of the document -->
<!-- Set the language of the page to English for screen readers and search engines -->

<head>
  <!-- Head section; this contains the setup information for your page NOT the visible content -->
  <!-- This is where you'll put metadata, the title, font links, css links, scripts etc -->

  <meta charset="UTF-8" />
  <!-- Ensure that symbols, emojis, and other weird character sets are displayed properly -->

  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- This sets up how the page is displayed on mobile; devices use their own widths and scales -->

  <title>PC+ | Library</title>
  <!-- The name of the page shown on your browser tab -->

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Link the Tailwind CSS framework to your page -->
  <!-- You can add utility classes from here in your HTML elements -->

  <script>
    // If you want, you can also add customizations here using the config() function. I added this here since I have everything in one file.
    tailwind.config={theme:{extend:{colors:{
      // Add custom teal colors to use for the UI design and theme
      teal0:"#041a1a",teal1:"#062626",teal2:"#083535",teal3:"#0b4747",
      // These are some semi-transparent colors used for the “glass” look of UI elements
      panel:"rgba(255,255,255,.06)",stroke:"rgba(255,255,255,.10)",
      // This is the accent color for the UI elements including buttons etc.
      accent:"#ff7a18"
    }}}}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <!-- Preconnect to Google Fonts API to speed up the font loading process -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Also preconnect to the font file itself and use crossorigin since it's required for fonts -->

  <link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet" />
  <!-- Use Google Font Yuji Mai. You can swap it with another font you prefer. -->
  <!-- :root { --mx: 0; --my: 0; } -->

  <style>
    :root{--mx:0;--my:0}

    html{
      background:#041a1a;
      overscroll-behavior:none;
    }
    /* Store cursor coordinates as CSS variables to make hover-glow follow mouse */

    body{
      font-family:"Yuji Mai",system-ui,sans-serif;
      /* Set default font for entire site to be Yuji Mai or fallback fonts. */

      letter-spacing:.35px;
      /* Add spacing between letters for a stylized, “game store” look */

      background:
        radial-gradient(1200px 700px at 15% 20%, rgba(255,122,24,.18), transparent 55%),
        radial-gradient(900px 600px at 85% 35%, rgba(0,255,200,.10), transparent 60%),
        linear-gradient(120deg,#041a1a,#083535,#062626,#0b4747);
      /* Set background for the site with radial highlights (glowy spots) and a gradient */

      background-size:100% 100%,100% 100%,300% 300%;
      /* Control background size */

      animation:bg 14s ease-in-out infinite alternate;
      /* Animate background slowly shifting colors */
      /* Apply a large background gradient that will animate for hover effects */
      /* Animation that shifts the background gradient back and forth */
    }

    @keyframes bg{0%{background-position:0 0,0 0,0% 50%}100%{background-position:0 0,0 0,100% 50%}}
    /* Define keyframes for animations; only move the third background layer from left to right */
    /* Use this keyframes animation to create a shifting gradient effect on hover */

    .glass{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.05));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.10)}
    /* Create a “glass” effect on .glass elements (behind them has to be blurred too!) */
    /* Apply this effect to create a frosted glass look */
    /*
      The following block is a reference idea (not used here) for an alternate glass style:
      .glass {
        background: linear-gradient(135deg, rgba(100, 100, 100, 0.15) 0%, rgba(70, 70, 70, 0.05) 100%);
        backdrop-filter: blur(20px);
        border: 1px solid #333;
      }
    */

    .shine{position:relative;overflow:hidden}
    /* Create an area that will get a hover “shine” effect on .hover-shine elements */
    /* Create a relative position area for hover shine that hides overflow so it looks nice on all elements */
    /*
      The following block is a reference idea (not used here) for an alternate shine style:
      .shine:before {
        content: '';
        position: absolute;
        top: var(--my);
        left: var(--mx);
        width: 200%;
        height: 200%;
        transform: translate(-50%, -50%) translateX(-75%);
        background: radial-gradient(circle at center, rgba(255,255,255,0.15) 25%, transparent 60%);
        transition: all 0.25s ease-in-out;
        opacity: 0;
        pointer-events: none;
      }
      .shine:hover:before {
        opacity: 1;
        transform: translate(-50%, -50%) translateX(25%);
      }
    */

    .shine:before{
      content:"";position:absolute;inset:-2px;opacity:0;transition:opacity .18s;pointer-events:none;
      background:radial-gradient(60px 60px at var(--mx) var(--my), rgba(255,255,255,.10), transparent 70%);
    }
    /* Display an overlay that follows the mouse position to simulate hover “shine” on .hover-shine elements */
    /* Make the hover “shine” a little visible, see next comment for more info! */

    .shine:hover:before{opacity:.25}
    /* On .hover-shine + :hover it makes the “glow” slightly visible (almost transparent) */

    .star-btn{display:inline-flex;align-items:center;justify-content:center}
    .star-svg{width:18px;height:18px}

    /*
      The following is a reference idea (not used here) for a container helper:
      .container { max-width: 1200px; margin: 0 auto; }
    */

    /*
      body {
        min-h-screen;
        text-white;
        selection:bg-teal3/50 selection:text-white
      }
      The actual body styling for those is done below using Tailwind classes.
    */
  </style>
</head>

<body class="min-h-screen text-white selection:bg-accent/30 selection:text-white">
  <!-- Add visible content inside body -->
  <!-- Set position relative for toast messages to work -->
  <!-- Add max width and padding for site content -->

  <div
    id="cursorGlow"
    class="pointer-events-none fixed left-0 top-0 rounded-full"
    style="width:0.12rem;height:0.12rem;opacity:0.035;filter:blur(2px);transform:translate(-50%,-50%);
           background:radial-gradient(circle,rgba(255,122,24,.55),rgba(0,255,200,.25),transparent 72%);"></div>
  <!-- *'s cursor glow effect; pointer pointer moves to cursor position making a glow effect behind it -->
  <!-- pointer-events:none means it's ignored when clicking something. This is crucial since the glow is always moving and can block whatever you're trying to click -->
  <!-- position it relative to the top left of the screen but translate it -50%-50% it'll center on the mouse pointer -->

  <div
    id="toast"
    class="pointer-events-none fixed bottom-6 left-1/2 z-[60] hidden -translate-x-1/2 rounded-2xl border border-white/10 bg-black/40 px-4 py-2 text-sm text-white/90 backdrop-blur-xl"></div>
  <!-- Toast notification; used to show small messages to the user like “Library cleared” -->
  <!-- z-[60] Exponent for how far away from other elements this thing should be -->
  <!-- Center it to the middle of the screen -->

  <header class="sticky top-0 z-50 border-b border-white/10 bg-black/20 backdrop-blur-xl">
    <!-- Top navigation bar -->
    <!-- Make nav bar stay at top but behind other UI elements -->
    <!-- backdrop-blur-xl makes a frosted glass like effect -->

    <div class="mx-auto flex max-w-7xl items-center gap-4 px-5 py-4">
      <!-- Add a container with gap and padding so it looks nice -->

      <a class="font-semibold tracking-tight hover:text-white/90 transition" href="customer-home.html">
        PC<span class="text-accent">+</span>
      </a>
      <!-- Logo + button only exists in store so it's not needed here -->

      <nav class="ml-2 flex flex-1 items-center gap-1 text-sm text-white/80">
        <!-- Make the nav a flex layout so everything is in a row -->

        <a id="navHome" class="rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="customer-home.html">Home</a>
        <a id="navLibrary" class="rounded-lg px-3 py-2 bg-white/10 text-white transition" href="library.html">Library</a>
        <a id="navCart" class="rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="cart.html">Cart</a>
        <a id="navLogin" class="rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="login.html">Login</a>
        <a id="navPubDashboard" class="hidden rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="../publisher/dashboard.html">Dashboard</a>
        <a id="navPubManage" class="hidden rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="../publisher/manage-games.html">Manage Games</a>
        <a id="navPubUpload" class="hidden rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="../publisher/upload-game.html">Upload Game</a>
        <a id="navPubProfile" class="hidden rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="../publisher/publisher-profile.html">Profile</a>
        <!-- The right most menu which features Login then account and possibly others. -->

        <div class="ml-auto hidden sm:flex items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-3 py-2">
          <!-- Search bar on right with glassy look -->
          <!-- This search container inside the header will only show on larger screen sizes. -->

          <svg class="h-4 w-4 text-white/70" viewBox="0 0 24 24" fill="none">
            <path d="M21 21l-4.3-4.3m1.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <!-- Displays a magnifying glass icon which is SVG, for the search bar -->
          <!-- Simple magnifying glass icon -->

          <input id="searchBox" class="w-56 bg-transparent text-sm outline-none placeholder:text-white/40" placeholder="Search library..." />
          <!-- Search input element, currently just visual -->
          <!-- Make search bar input filter library tiles -->
        </div>
      </nav>
    </div>
  </header>

  <main class="relative z-10 mx-auto max-w-7xl px-5 pb-16 pt-10">
    <!-- Add visible content inside body -->
    <!-- The main content of the page, including page title and grid display of game tiles. -->

    <div class="mb-6 flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
      <!-- Container at top for page heading and buttons -->
      <!-- Flexible layout with column layout on small screens but row on big screens -->

      <div>
        <h1 class="text-3xl sm:text-4xl font-semibold tracking-tight">Library</h1>
        <p id="subLine" class="mt-2 text-white/70 text-sm"></p>
        <!-- Page title and subtitle; subtitle gets filled in by JavaScript -->
      </div>

      <div class="flex items-center gap-2">
        <!-- Button group on right hand side of page -->

        <button
          id="btnClear"
          class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white/80 hover:bg-white/10 hover:text-white transition hidden">
          Clear Library
        </button>
        <!-- Clear library button; gets hidden by default so it's clickable by JavaScript only when needed -->

        <a href="customer-home.html" class="rounded-xl bg-accent px-4 py-2 text-sm font-semibold text-white hover:brightness-110 transition">
          Browse Store
        </a>
        <!-- Link to go back to store and browse for games -->
      </div>
    </div>

    <section id="emptyState" class="glass rounded-3xl p-6 hidden">
      <!-- Empty state card gets hidden and shown by JavaScript depending on if there are any games. -->

      <p class="text-xs tracking-widest text-white/60">EMPTY</p>
      <!-- Small label text -->

      <h2 id="emptyTitle" class="mt-2 text-xl font-semibold tracking-tight">Your library is empty.</h2>
      <!-- Title text that gets swapped out by JavaScript -->

      <p id="emptyDesc" class="mt-2 text-sm text-white/70"></p>
      <!-- Description text that gets swapped out by JavaScript -->

      <div class="mt-4 flex items-center gap-3">
        <!-- Action buttons go here inside empty state card -->

        <a href="customer-home.html" class="rounded-xl bg-accent px-4 py-2 text-sm font-semibold text-white hover:brightness-110 transition">Browse</a>
        <!-- Link to browse store -->

        <a href="login.html" class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white/80 hover:bg-white/10 hover:text-white transition">Login</a>
        <!-- Link to go to login page -->
      </div>
    </section>

    <section id="grid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></section>
    <!-- Container to hold the game tiles for the users library -->
    <!-- Make it a grid layout -->
    <!-- Set it to have 2 columns on small screens and 3 columns on big screens -->
  </main>

  <script src="../assets/js/auth.js"></script>
  <script>
    if (window.PCPlusAuth && !window.PCPlusAuth.requireRole("customer", "login.html")) {
      throw new Error("Customer role required");
    }

    const toast=(t)=>{
      const el=document.getElementById("toast");
      el.textContent=t;
      el.classList.remove("hidden");
      clearTimeout(toast._t);
      toast._t=setTimeout(()=>el.classList.add("hidden"),900);
    };
    // Function to handle toast notifications with a parameter called *msg*
    // Reuse single #toast div. Changes div text to msg then makes visible (removes hidden). Hide after 900ms

    const session=()=>window.PCPlusAuth?window.PCPlusAuth.getSession():null;
    const getAvatarEmoji=(email)=>window.PCPlusAuth?window.PCPlusAuth.getAvatarEmoji(email):"🦊";
    // Define session function which reads localStorage string and turns into JSON
    // LocalStorage only stores strings, so convert JSON object to string.
    // LocalStorage converts string back into JSON object to use in program

    const s=session();
    // Grab current session data from localStorage (only do once at page load)

    const nav=document.getElementById("navLogin");
    const navRoot=nav?nav.closest("nav"):null;
    const navSearchWrap=navRoot?navRoot.querySelector(".ml-auto"):null;
    const navHome=document.getElementById("navHome");
    const navLibrary=document.getElementById("navLibrary");
    const navCart=document.getElementById("navCart");
    const navPubDashboard=document.getElementById("navPubDashboard");
    const navPubManage=document.getElementById("navPubManage");
    const navPubUpload=document.getElementById("navPubUpload");
    const navPubProfile=document.getElementById("navPubProfile");
    const pubLinks=[navPubDashboard,navPubManage,navPubUpload,navPubProfile];

    const orderNav=(items)=>{
      if(!navRoot) return;
      const frag=document.createDocumentFragment();
      items.forEach((el)=>{
        if(!el) return;
        frag.appendChild(el);
      });
      if(navSearchWrap) navRoot.insertBefore(frag,navSearchWrap);
      else navRoot.appendChild(frag);
    };

    const isPublisher=!!(s&&s.role==="publisher");
    if(navLibrary) navLibrary.classList.toggle("hidden",isPublisher);
    if(navCart) navCart.classList.toggle("hidden",isPublisher);
    pubLinks.forEach((el)=>{ if(el) el.classList.toggle("hidden",!isPublisher); });

    if(nav){
      nav.classList.remove("hidden");
      nav.href="login.html";
      nav.textContent=(s&&s.email)?("Logged in "+getAvatarEmoji(s.email)):"Login";
    }

    if(isPublisher){
      orderNav([navHome,navPubDashboard,navPubManage,navPubUpload,navPubProfile,nav]);
    }else{
      orderNav([navHome,navLibrary,navCart,nav]);
    }
    const isLoggedIn=()=>{const ss=session(); return !!(ss&&ss.email&&ss.role==="customer");};
    // Method to check if user is logged in or not
    // Session function called here again in case it changed (Get fresh data)

    const loadLib=()=>{try{return JSON.parse(localStorage.getItem("pcplus_library")||"[]")}catch{return []}};
    // Function that loads library data from local storage or returns empty array

    const saveLib=(a)=>localStorage.setItem("pcplus_library",JSON.stringify(a||[]));
    // Function that saves updated library array into local storage

    const loadRatings=()=>{try{return JSON.parse(localStorage.getItem("pcplus_ratings")||"{}")}catch{return {}}};
    // Load the ratings map from local storage using each game id as the key.

    const saveRatings=(r)=>localStorage.setItem("pcplus_ratings",JSON.stringify(r||{}));
    // Save all rating updates back to local storage.

    const STATIC_GAMES={
      destiny2:{id:"destiny2",title:"Destiny 2",type:"Shooter • MMO",img:"../assets/img/destiny2-1.jpg"},
      hollowknight:{id:"hollowknight",title:"Hollow Knight",type:"Metroidvania",img:"../assets/img/hollowknight-1.jpg"},
      minecraft:{id:"minecraft",title:"Minecraft",type:"Sandbox",img:"../assets/img/minecraft-1.jpg"},
      "9kings":{id:"9kings",title:"9 Kings",type:"Strategy",img:"../assets/img/9kings-1.jpg"},
      gemcraft:{id:"gemcraft",title:"Gem Craft",type:"Tower Defense",img:"../assets/img/gemcraft-1.jpg"},
      mariokartworlds:{id:"mariokartworlds",title:"Mario Kart World",type:"Racing",img:"../assets/img/mariokartworld-1.png"}
    };
    // Database of game info where the key is unique name used in library data and value has all tile attributes.

    const normalizeId=(x)=>{
      const t=(x||"").toLowerCase().replace(/[^a-z0-9]/g,"");
      if(t==="9kings") return "9kings";
      if(t==="mariokartworld"||t==="mariokartworlds"||t==="mariokart") return "mariokartworlds";
      if(t==="destiny") return "destiny2";
      return t;
    };
    // Normalize string for library function to fix any weird saved strings when comparing with game database.
    // Get rid of any non-alphanumeric characters so strings match.
    // Convert any variations of “destiny” to match database key names.

    const isPlaceholderImagePath=(path)=>{
      const raw=String(path||"").trim().toLowerCase();
      return !raw||raw.includes("your-image-here")||raw.includes("replace-with-image")||raw.includes("placeholder");
    };
    const resolveStoreImage=(path)=>isPlaceholderImagePath(path)?"../assets/img/sale.png":String(path).trim();

    const loadPublisherGamesForLibrary=()=>{
      let records=[];
      try{records=JSON.parse(localStorage.getItem("games_v1")||"[]")}catch{records=[]}
      if(!Array.isArray(records)) return {};

      const mapped={};
      records.forEach((rec,index)=>{
        const key=
          normalizeId(rec&&rec.storeKey)||
          normalizeId(`pub${(rec&&rec.title)||"game"}${(rec&&rec.id)||index}`)||
          `pubgame${index+1}`;
        mapped[key]={
          id:key,
          title:String((rec&&rec.title)||`Publisher Game ${index+1}`),
          type:String((rec&&rec.genre)||"Publisher Game")+" • Publisher",
          img:resolveStoreImage(rec&&rec.imagePath)
        };
      });
      return mapped;
    };

    const getGamesMap=()=>({...STATIC_GAMES,...loadPublisherGamesForLibrary()});

    const glow=document.getElementById("cursorGlow");
    addEventListener("mousemove",e=>{glow.style.left=e.clientX+"px";glow.style.top=e.clientY+"px"},{passive:true});
    // A universal glow dot following mouse pointer effects everything but not intrusive enough to annoy you!

    const setVars=(el,e)=>{
      const r=el.getBoundingClientRect();
      el.style.setProperty("--mx",(e.clientX-r.left)+"px");
      el.style.setProperty("--my",(e.clientY-r.top)+"px");
    };
    // Set CSS cursor style variable --mx and --my of a single card element which is used by shine's glow effect.
    // Get element size and position relative to viewport (needed for setting where mouse glow appears)
    // Get mouse X position relative to element (needed for setting where mouse glow appears)
    // Get mouse Y position relative to element (needed for setting where mouse glow appears)

    const starSvg=(fill,half=false)=>`
      <svg class="star-svg" viewBox="0 0 24 24" fill="${fill ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <defs>
          <linearGradient id="halfGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="50%" stop-color="currentColor"/>
            <stop offset="50%" stop-color="transparent"/>
          </linearGradient>
        </defs>
        <path ${half ? 'fill="url(#halfGrad)"' : ""} d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path>
      </svg>
    `;

    const ratingUi=(id,val)=>`
      <div class="mt-4 rounded-2xl border border-white/10 bg-white/5 p-3">
        <p class="text-[11px] tracking-widest text-white/60">YOUR RATING</p>
        <div class="mt-2 flex items-center gap-1 text-white/50" data-rate-wrap="${id}">
          ${Array.from({length:5},(_,i)=>{
            const starIndex=i+1;
            const full=val>=starIndex;
            const half=!full&&val>=starIndex-0.5;
            const color=(full||half)?"text-accent":"text-white/25";
            return `
              <button class="star-btn ${color}" data-rate="${id}" data-star="${starIndex}" aria-label="Rate ${starIndex} stars">
                ${full ? starSvg(true,false) : (half ? starSvg(false,true) : starSvg(false,false))}
              </button>
            `;
          }).join("")}
          <span class="ml-2 text-sm text-white/70" data-rate-text="${id}">${(val||0).toFixed(1)}</span>
        </div>
      </div>
    `;

    const tile=(g,rateVal)=>`
      <article class="shine glass rounded-3xl p-5" data-tilt>
        <p class="text-xs tracking-widest text-white/60">OWNED</p>
        <h3 class="mt-2 text-lg font-semibold tracking-tight">${g.title}</h3>
        <p class="mt-1 text-sm text-white/70">${g.type}</p>

        <div class="mt-4 overflow-hidden rounded-2xl border border-white/10 bg-black/30">
          <img class="h-40 w-full object-cover" src="${g.img}" alt="${g.title}" />
        </div>

        ${ratingUi(g.id,rateVal)}

        <div class="mt-4 grid grid-cols-2 gap-2">
          <button data-play="${g.id}"
                  class="rounded-xl bg-accent px-4 py-2 text-sm font-semibold text-white hover:brightness-110 transition">
            ▶ Play
          </button>
          <a href="details.html?id=${g.id}"
             class="text-center rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white/80 hover:bg-white/10 hover:text-white transition">
            Details
          </a>
        </div>
      </article>
    `;
    // Return a chunk of HTML that represents a single library tile.

    const getHalfFromClick=(btn,e)=>{
      const r=btn.getBoundingClientRect();
      const x=e.clientX-r.left;
      return (x<r.width/2)?0.5:1;
    };

    const setRating=(id,val)=>{
      const r=loadRatings();
      r[id]=val;
      saveRatings(r);
    };

    const renderRatingsFor=(id)=>{
      const r=loadRatings();
      const val=Number(r[id]||0);

      const wrap=document.querySelector(`[data-rate-wrap="${id}"]`);
      const text=document.querySelector(`[data-rate-text="${id}"]`);
      if(text) text.textContent=`${val.toFixed(1)}`;

      if(!wrap) return;

      wrap.querySelectorAll(`[data-rate="${id}"]`).forEach((btn)=>{
        const star=Number(btn.dataset.star);
        const full=val>=star;
        const half=!full&&val>=star-0.5;

        btn.classList.remove("text-accent","text-white/25");
        btn.classList.add((full||half)?"text-accent":"text-white/25");
        btn.innerHTML=full ? starSvg(true,false) : (half ? starSvg(false,true) : starSvg(false,false));
      });
    };

    const render=()=>{
      const games=getGamesMap();
      const empty=document.getElementById("emptyState");
      const grid=document.getElementById("grid");
      const btnClear=document.getElementById("btnClear");
      const sub=document.getElementById("subLine");
      const emptyTitle=document.getElementById("emptyTitle");
      const emptyDesc=document.getElementById("emptyDesc");
      const q=(document.getElementById("searchBox")?.value||"").trim().toLowerCase();

      // Render function updates login status, replaces library data, adds search functionality + clears library + loads all tiles + changes UI depending on what happens on client side.
      // Replace search input value with actual search query using optional chaining in case search box is undefined.
      // Optional chaining made sure no errors return nothing instead of throwing exception when no matches with search query.

      // ✅ KEY CHANGE: logged out => library must show empty always
      // Makes sure non logged in users must have empty libraries. Prevents people owning games they don't own if there's no session initiated.
      if(!isLoggedIn()){
        emptyTitle.textContent="You’re not logged in.";
        emptyDesc.textContent="Log in to view your library. When logged out, the library stays empty.";
        empty.classList.remove("hidden");
        grid.classList.add("hidden");
        btnClear.classList.add("hidden");
        sub.textContent="Not signed in.";
        return;
      }

      const raw = loadLib().map(normalizeId).filter(id=>games[id]);
      // Assign variable raw which obtains all of user's library ID strings from local storage and converts them into JSON format.

      const filtered = raw.filter(id=>{
        if(!q) return true;
        const g=games[id];
        return g.title.toLowerCase().includes(q) || g.type.toLowerCase().includes(q) || g.id.toLowerCase().includes(q);
      });

      emptyTitle.textContent="Your library is empty.";
      emptyDesc.textContent="Checkout from your Cart to add games here instantly.";

      empty.classList.toggle("hidden", raw.length>0);
      grid.classList.toggle("hidden", raw.length===0);
      btnClear.classList.toggle("hidden", raw.length===0);

      sub.textContent = raw.length ? `Games owned: ${raw.length}` : "No games yet.";

      const ratings=loadRatings();
      grid.innerHTML = filtered.map(id=>tile(games[id],Number(ratings[id]||0))).join("");

      document.querySelectorAll("[data-tilt]").forEach(el=>{
        el.onmousemove=(e)=>setVars(el,e);
        el.onmouseleave=()=>{ el.style.setProperty("--mx","0px"); el.style.setProperty("--my","0px"); };
      });

      document.querySelectorAll("[data-play]").forEach(b=>{
        b.onclick=()=>{
          const id=b.dataset.play;
          if(normalizeId(id)==="gemcraft"){
            location.href="gemcraft-play.html";
            return;
          }
          toast(`Launching ${(games[id]&&games[id].title)||"Game"}...`);
        };
      });

      document.querySelectorAll("[data-rate]").forEach((btn)=>{
        btn.onclick=(e)=>{
          const id=btn.dataset.rate;
          const star=Number(btn.dataset.star);
          const half=getHalfFromClick(btn,e);
          const newVal=(star-1)+half;
          setRating(id,newVal);
          renderRatingsFor(id);
          toast(`Rated ${newVal.toFixed(1)} stars`);
        };
      });
    };

    document.getElementById("btnClear").onclick=()=>{
      saveLib([]);
      toast("Library cleared");
      render();
    };
    // Button's Clear Library function made here; hides card details down so user can start fresh

    const searchBox=document.getElementById("searchBox");
    if(searchBox) searchBox.addEventListener("input", render);

    render();
  </script>
</body>
</html>
