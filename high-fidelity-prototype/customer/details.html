<!doctype html>
<!-- tells the browser this file is written using modern HTML (HTML5) -->

<html lang="en">
<!-- <html lang="en"> the root element of every webpage (all elements must be inside)
     lang="en" helps browsers and accessibility tools know the language is English -->

<head>
  <!-- <head> contains page setup info and is not displayed on the page -->

  <meta charset="UTF-8" />
  <!-- <meta> tag contains information about the page
       ensures text and symbols display correctly -->

  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- width=device-width means page width = device width
       initial-scale=1 means do not zoom in or out initially -->

  <title>PC+ | Game Details</title>
  <!-- <title>Game Details</title> is the page title shown in the tab -->

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- <script src="...tailwind.min.js"></script> loads Tailwind CSS
       Tailwind adds lots of utility classes to the HTML elements -->

  <script>
    // The following <script> modifies the Tailwind config to use custom colors
    tailwind.config={theme:{extend:{colors:{
      teal0:"#041a1a",teal1:"#062626",teal2:"#083535",teal3:"#0b4747",
      panel:"rgba(255,255,255,.06)",stroke:"rgba(255,255,255,.10)",accent:"#ff7a18"
    }}}}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <!-- <link rel="preconnect" href="https://fonts.googleapis.com" /> loads the Yuji Mai font (faster connection setup) -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> loads the Yuji Mai font (connects to font file host) -->

  <link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet" />
  <!-- <link href="...Yuji+Mai..." rel="stylesheet" /> loads the Yuji Mai font -->

  <style>
    :root{--mx:0;--my:0}

    html{
      background:#041a1a;
      overscroll-behavior:none;
    }
    /* :root { ... } defines CSS variables and these apply to the entire page
       --mx and --my are set by JS and track mouse coordinates for hover shines */

    body{
      /* CSS body { ... } sets the default font, letter spacing, and background colors */

      font-family:"Yuji Mai",system-ui,sans-serif;
      letter-spacing:.35px;

      /* background-image has 3 layers, with 3 different background colors */
      background:
        radial-gradient(1200px 700px at 15% 20%, rgba(255,122,24,.18), transparent 55%),
        radial-gradient(900px 600px at 85% 35%, rgba(0,255,200,.10), transparent 60%),
        linear-gradient(120deg,#041a1a,#083535,#062626,#0b4747);

      background-size:100% 100%,100% 100%,300% 300%;

      animation:bg 14s ease-in-out infinite alternate
      /* The @keyframes "animateBG" defines how the background moves (gradient only) */
    }

    @keyframes bg{0%{background-position:0 0,0 0,0% 50%}100%{background-position:0 0,0 0,100% 50%}}
    /* The @keyframes "animateBG" defines how the background moves (gradient only) */

    .glass{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.05));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.10)}
    /* The following <div> is the "glow" for card hovers and is toggled with CSS */

    .shine{position:relative;overflow:hidden}
    /* The following <div> is the "glow" for card hovers and is toggled with CSS */

    .shine:before{
      content:"";position:absolute;inset:-2px;opacity:0;transition:opacity .18s;pointer-events:none;
      background:radial-gradient(18px 18px at var(--mx) var(--my), rgba(255,255,255,.10), transparent 70%);
      /* The following <div> is the "glow" for card hovers and is toggled with CSS */
    }

    .shine:hover:before{opacity:.25}
    /* The following <div> is the "glow" for card hovers and is toggled with CSS */

    .reveal{opacity:0;transform:translateY(10px) scale(.98);filter:blur(6px)}
    /* The following <div>s display a loading animation when called by JS */

    .reveal.in{opacity:1;transform:translateY(0) scale(1);filter:blur(0);transition:opacity .7s,transform .7s,filter .7s}
    /* The following <div>s display a loading animation when called by JS */
  </style>
</head>

<body class="min-h-screen text-white selection:bg-accent/30 selection:text-white">
  <!-- <div> elements are containers for HTML content (everything but <head>) -->

  <div id="cursorGlow" class="pointer-events-none fixed left-0 top-0 rounded-full"
       style="width:0.12rem;height:0.12rem;opacity:0.035;filter:blur(2px);transform:translate(-50%,-50%);
              background:radial-gradient(circle,rgba(255,122,24,.55),rgba(0,255,200,.25),transparent 72%);"></div>
  <!-- The following <div> is the glow for the cursor and follows it -->

  <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-[60] hidden -translate-x-1/2 rounded-2xl border border-white/10 bg-black/40 px-4 py-2 text-sm text-white/90 backdrop-blur-xl"></div>
  <!-- The following <div>s display a loading animation when called by JS -->

  <header class="sticky top-0 z-50 border-b border-white/10 bg-black/20 backdrop-blur-xl">
    <!-- The following <div> is used for a "sticky" header that is always visible -->
    <!-- <header> defines a specific top header section of the page (includes nav) -->

    <div class="mx-auto flex max-w-7xl items-center gap-4 px-5 py-4">
      <!-- <div class="container"> restricts overall width so content is centered -->

      <a class="font-semibold tracking-tight hover:text-white/90 transition" href="customer-home.html">PC<span class="text-accent">+</span></a>
      <!-- The <a> element defines a hyperlink
           href="..." tells where clicking on it will take you -->
      <!-- Clicking #topLeftLogo returns user to home page -->

      <nav class="ml-2 flex flex-1 items-center gap-1 text-sm text-white/80">
        <!-- <nav> tags define a container for navigation links (usually in headers) -->
        <!-- Items in <nav> can be updated when user logs in (see session()) -->

        <a id="navHome" class="rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="customer-home.html">Home</a>
        <a id="navLibrary" class="rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="library.html">Library</a>
        <a id="navCart" class="rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="cart.html">Cart</a>
        <a id="navLogin" class="rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="login.html">Login</a>
        <a id="navPubDashboard" class="hidden rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="../publisher/dashboard.html">Dashboard</a>
        <a id="navPubManage" class="hidden rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="../publisher/manage-games.html">Manage Games</a>
        <a id="navPubUpload" class="hidden rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="../publisher/upload-game.html">Upload Game</a>
        <a id="navPubProfile" class="hidden rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="../publisher/publisher-profile.html">Profile</a>
        <!-- Displays Logged in if session exists, else Login or Signup link -->

        <div class="ml-auto hidden sm:flex items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-3 py-2">
          <!-- Search bar (<input type="search">) for searching text on the site -->
          <svg class="h-4 w-4 text-white/70" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.3-4.3m1.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="searchBox" class="w-56 bg-transparent text-sm outline-none placeholder:text-white/40" placeholder="Search games..." />
          <!-- Buttons and form <input>s can also be clickable (see nav.html) -->
        </div>
      </nav>
    </div>
  </header>

  <main class="relative z-10 mx-auto max-w-7xl px-5 pb-16 pt-10">
    <!-- Main content of page has id="pageContent" -->

    <div class="mb-6 flex items-center justify-between gap-3">
      <!-- pageContent's main section (except header and footer) uses a grid layout -->

      <a href="customer-home.html" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white/80 hover:bg-white/10 hover:text-white transition">
        <span aria-hidden="true">←</span> Back
      </a>
      <!-- Back link #backBtn returns user to home page -->

      <div class="flex items-center gap-2">
        <span id="pillType" class="rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs text-white/70">Type</span>
        <!-- #pillType and #pillPrice display a game's type/price (updated via JS) -->

        <span id="pillPrice" class="rounded-xl bg-accent px-3 py-1 text-xs font-semibold text-white">$0.00</span>
        <!-- #pillType and #pillPrice display a game's type/price (updated via JS) -->
      </div>
    </div>

    <section class="grid gap-5 lg:grid-cols-12">
      <!-- On wider screens, grid has 12 columns (otherwise fewer) -->

      <div class="reveal shine glass rounded-3xl p-6 lg:col-span-7" data-tilt>
        <!-- #leftBigCard contains main content for left big card -->
        <!-- Combined "reveal shine glass" effects for hover tilt animations -->
        <!-- data-tilt attribute tells JS which elements to animate on hover -->

        <div class="flex items-start justify-between gap-4">
          <!-- #titleInfoDiv contains all title text and info on left side of cards -->

          <div class="min-w-0">
            <!-- min-w-0 class allows text truncation to work when in flex containers -->

            <h1 id="gTitle" class="truncate text-3xl sm:text-4xl font-semibold tracking-tight">Game Title</h1>
            <!-- Game titles use id=gTitle and are dynamically inserted with JS -->

            <p id="gTagline" class="mt-2 text-white/70">A short, punchy description goes here.</p>
            <!-- Game taglines use id=gTagline and are dynamically inserted with JS -->

            <div class="mt-4 flex flex-wrap items-center gap-2 text-xs text-white/70">
              <!-- Small info pills use class="infoPill" for consistent styling -->

              <span id="gStars" class="flex items-center gap-1 rounded-full border border-white/10 bg-white/5 px-3 py-1"></span>
              <!-- #gStars displays graphical stars for rating (number of stars varies) -->

              <span id="gPlayers" class="rounded-full border border-white/10 bg-white/5 px-3 py-1">Single-player</span>
              <!-- #gPlayers displays number of players a game supports -->

              <span id="gModes" class="rounded-full border border-white/10 bg-white/5 px-3 py-1">Controller</span>
              <!-- #gModes displays game modes (single player, multiplayer, etc.) -->
            </div>
          </div>

          <button id="addBtnTop" class="shrink-0 rounded-xl bg-accent px-4 py-2 text-sm font-semibold text-white hover:brightness-110 transition">
            Add to Cart
          </button>
          <!-- #addToCartBtnTop is "Add to Cart" button on top right of leftBigCard -->
        </div>

        <div class="mt-6 overflow-hidden rounded-2xl border border-white/10 bg-black/30">
          <img id="heroImg" class="h-72 sm:h-96 w-full object-cover transition duration-700" alt="Game hero" />
          <!-- #heroImg displays a game's hero image (rotates in carousel) -->
        </div>

        <div class="mt-4 flex items-center justify-between gap-3">
          <!-- #carouselControls controls which image is displayed in carousel -->

          <div class="flex items-center gap-2">
            <button id="prevImg" class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white/80 hover:bg-white/10 hover:text-white transition">Prev</button>
            <button id="nextImg" class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white/80 hover:bg-white/10 hover:text-white transition">Next</button>
            <!-- Buttons and form <input>s can also be clickable (see nav.html) -->
          </div>

          <div id="imgDots" class="flex items-center gap-2"></div>
          <!-- #imgDots displays small buttons that select which carousel image -->
        </div>
      </div>

      <div class="reveal glass rounded-3xl p-6 lg:col-span-5">
        <!-- #rightCard contains right card "Overview" and Info Grid sections -->

        <p class="text-xs tracking-widest text-white/60">OVERVIEW</p>

        <div class="mt-2 flex items-center justify-between gap-3">
          <h2 class="text-xl font-semibold tracking-tight">Details</h2>
          <span id="ratingBadge" class="rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs text-white/70">Rating</span>
          <!-- #ratingBadge displays star ratings like 4.2 / 5 from 20 user reviews -->
        </div>

        <p id="gOverview" class="mt-3 text-sm text-white/70 leading-relaxed"></p>
        <!-- #gOverview contains textual overview information about a game -->

        <div class="mt-5 grid gap-3 sm:grid-cols-2">
          <!-- 2-column grid layout for mini info blocks under Overview section -->

          <div class="rounded-2xl border border-white/10 bg-white/5 p-4">
            <p class="text-xs tracking-widest text-white/60">GENRE</p>
            <p id="gGenre" class="mt-1 text-sm text-white/80"></p>
          </div>
          <div class="rounded-2xl border border-white/10 bg-white/5 p-4">
            <p class="text-xs tracking-widest text-white/60">RELEASE</p>
            <p id="gRelease" class="mt-1 text-sm text-white/80"></p>
          </div>
          <div class="rounded-2xl border border-white/10 bg-white/5 p-4">
            <p class="text-xs tracking-widest text-white/60">DEVELOPER</p>
            <p id="gDev" class="mt-1 text-sm text-white/80"></p>
          </div>
          <div class="rounded-2xl border border-white/10 bg-white/5 p-4">
            <p class="text-xs tracking-widest text-white/60">PLATFORM</p>
            <p id="gPlatform" class="mt-1 text-sm text-white/80"></p>
          </div>
        </div>

        <div class="mt-6 flex items-center justify-between gap-3">
          <span id="priceBig" class="rounded-2xl bg-accent px-4 py-2 text-sm font-semibold text-white">$0.00</span>
          <!-- Contains price in large font above bottom "Add to Cart" button -->

          <button id="addBtn" class="rounded-xl bg-accent px-5 py-2 text-sm font-semibold text-white hover:brightness-110 transition">
            Add to Cart
          </button>
          <!-- Buttons and form <input>s can also be clickable (see nav.html) -->
        </div>

        <div class="mt-5 rounded-2xl border border-white/10 bg-white/5 p-4">
          <p class="text-xs tracking-widest text-white/60">FEATURES</p>
          <ul id="gBullets" class="mt-2 space-y-2 text-sm text-white/75"></ul>
          <!-- #gBullets contains feature bullet <li> elements in an unordered list -->
        </div>
      </div>

      <div class="reveal glass rounded-3xl p-6 lg:col-span-12">
        <!-- Bottom section contains "More Like This" game recommendations -->

        <div class="flex items-center justify-between gap-3">
          <p class="text-xs tracking-widest text-white/60">MORE LIKE THIS</p>
          <a href="customer-home.html" class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white/80 hover:bg-white/10 hover:text-white transition">Browse</a>

               href="..." tells where clicking on it will take you -->
        </div>

        <div id="moreWrap" class="mt-4 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
        <!-- More Like This cards are inserted inside #moreWrap by JS -->
      </div>
    </section>
  </main>

  <script src="../assets/js/auth.js"></script>
  <script>
    // toast() displays a toast message for about 1 second, for example "Added to cart!"
    const toast=(t)=>{
      const el=document.getElementById("toast");
      el.textContent=t;
      el.classList.remove("hidden");
      clearTimeout(toast._t);
      toast._t=setTimeout(()=>el.classList.add("hidden"),950);
    };

    // session() reads login session info from localStorage (saved by JS)
    const session=()=>window.PCPlusAuth?window.PCPlusAuth.getSession():null;
    const getAvatarEmoji=(email)=>window.PCPlusAuth?window.PCPlusAuth.getAvatarEmoji(email):"🦊";

    // s stores the current login session (email, name, etc.)
    const s=session();

    // Displays role-aware menu state and keeps publisher menu ordering consistent.
    const nav=document.getElementById("navLogin");
    const navRoot=nav?nav.closest("nav"):null;
    const navSearchWrap=navRoot?navRoot.querySelector(".ml-auto"):null;
    const searchBox=document.getElementById("searchBox");
    const runHomeSearchRedirect=()=>{
      const q=(searchBox?.value||"").trim();
      location.href=q?`customer-home.html?q=${encodeURIComponent(q)}`:"customer-home.html";
    };
    if(searchBox){
      searchBox.addEventListener("keydown",(e)=>{
        if(e.key!=="Enter") return;
        e.preventDefault();
        runHomeSearchRedirect();
      });
    }
    const navHome=document.getElementById("navHome");
    const navLibrary=document.getElementById("navLibrary");
    const navCart=document.getElementById("navCart");
    const navPubDashboard=document.getElementById("navPubDashboard");
    const navPubManage=document.getElementById("navPubManage");
    const navPubUpload=document.getElementById("navPubUpload");
    const navPubProfile=document.getElementById("navPubProfile");
    const pubLinks=[navPubDashboard,navPubManage,navPubUpload,navPubProfile];

    const orderNav=(items)=>{
      if(!navRoot) return;
      const frag=document.createDocumentFragment();
      items.forEach((el)=>{
        if(!el) return;
        frag.appendChild(el);
      });
      if(navSearchWrap) navRoot.insertBefore(frag,navSearchWrap);
      else navRoot.appendChild(frag);
    };

    const isPublisherViewOnly=!!(s&&s.role==="publisher");
    if(navLibrary) navLibrary.classList.toggle("hidden",isPublisherViewOnly);
    if(navCart) navCart.classList.toggle("hidden",isPublisherViewOnly);
    pubLinks.forEach((el)=>{ if(el) el.classList.toggle("hidden",!isPublisherViewOnly); });

    if(nav){
      nav.classList.remove("hidden");
      nav.href="login.html";
      nav.textContent=(s&&s.email)?("Logged in "+getAvatarEmoji(s.email)):"Login";
    }

    if(isPublisherViewOnly){
      orderNav([navHome,navPubDashboard,navPubManage,navPubUpload,navPubProfile,nav]);
    }else{
      orderNav([navHome,navLibrary,navCart,nav]);
    }
    // isLoggedIn() returns true if there is an email in session info
    const isLoggedIn=()=>{const ss=session(); return !!(ss&&ss.email&&ss.role==="customer");};

    // Cart helpers: pcplus_cart stores list of game ids in user's cart
    const loadCart=()=>{try{return JSON.parse(localStorage.getItem("pcplus_cart")||"[]")}catch{return []}};

    // saveCart() saves list of game ids from pcplus_cart (in localStorage)
    const saveCart=(a)=>localStorage.setItem("pcplus_cart",JSON.stringify(a||[]));

    // requireLogin() forces login for an action and shows a message if not logged in
    const requireLogin=(actionLabel)=>{
      if(isLoggedIn()) return true;
      toast(`Please log in with a customer account to ${actionLabel}.`);
      setTimeout(()=>location.href="login.html",700);
      return false;
    };

    // addToCart() adds a game to the cart; requires login first (for security)
    const addToCart=(id)=>{
      if(isPublisherViewOnly){
        toast("Publisher accounts can view details but cannot purchase.");
        return;
      }
      if(!requireLogin("add items to your cart")) return;
      const c=loadCart(); c.push(id); saveCart(c);
      toast("Added to cart");
    };

    // Reads the query string from the URL and stores it in a URLSearchParams object
    // Example URL: details.html?id=minecraft
    const qs=new URLSearchParams(location.search);

    // Extracts game id from the query string param named "id" (gid below)
    const gid=(qs.get("id")||"destiny2").toLowerCase().replace(/[^a-z0-9]/g,"");

    // star() builds a single star icon (filled or dim)
    const star=f=>`<svg class="h-4 w-4 ${f?'text-accent':'text-white/25'}" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.3l-6.18 3.64 1.64-7.03L2 9.24l7.19-.61L12 2l2.81 6.63 7.19.61-5.46 4.67 1.64 7.03z"/></svg>`;

    // stars() builds the full star row and the numeric rating text
    const stars=n=>`<span class="flex items-center">${Array.from({length:5},(_,i)=>star(i<n)).join("")}</span><span class="ml-2 text-white/60">${n.toFixed(1)}</span>`;

    // Game data "database" used to fill the page dynamically
    const STATIC_GAMES={
      destiny2:{
        title:"Destiny 2",type:"Shooter • MMO",genre:"Action / FPS",release:"2017",dev:"Bungie",platform:"PC",
        price:"$0.00",rating:4.2,players:"Co-op + PvP",modes:"Controller • KBM",
        tagline:"Co-op raids, PvP, and endless loot. Jump in fast.",
        overview:"Enter a living sci-fi universe packed with raids, strikes, seasonal events, and competitive PvP. Chase new gear, tune your build, and team up for endgame moments that feel cinematic.",
        bullets:["Raid-ready co-op activities","Build crafting and loot chase","PvP playlists + events","Seasonal content drops"],
        imgs:["../assets/img/destiny2-1.jpg","../assets/img/destiny2-2.jpg","../assets/img/destiny2-3.jpg"]
      },
      hollowknight:{
        title:"Hollow Knight",type:"Metroidvania",genre:"Action / Adventure",release:"2017",dev:"Team Cherry",platform:"PC",
        price:"$14.99",rating:4.8,players:"Single-player",modes:"Controller • KBM",
        tagline:"Gorgeous, brutal, and beautifully quiet.",
        overview:"Explore a haunting underground kingdom. Master tight combat, uncover hidden routes, and chase secrets through hand-crafted zones that reward patience and curiosity.",
        bullets:["Tight, responsive combat","Deep exploration with secrets","Boss fights that test skill","Atmospheric hand-drawn world"],
        imgs:["../assets/img/hollowknight-1.jpg","../assets/img/hollowknight-2.jpeg","../assets/img/hollowknight-3.jpg"]
      },
      minecraft:{
        title:"Minecraft",type:"Sandbox",genre:"Sandbox / Survival",release:"2011",dev:"Mojang",platform:"PC",
        price:"$29.99",rating:4.9,players:"Solo or Online",modes:"Controller • KBM",
        tagline:"Build anything. Survive everything. Forever.",
        overview:"A limitless sandbox where you craft, mine, build, and survive. Create massive worlds, automate systems, or just chill and design something beautiful with friends.",
        bullets:["Creative and Survival modes","Endless building possibilities","Multiplayer servers","Mods + community creations"],
        imgs:["../assets/img/minecraft-1.jpg","../assets/img/minecraft-2.jpg","../assets/img/minecraft-3.jpeg"]
      },
      "9kings":{
        title:"9 Kings",type:"Strategy",genre:"Strategy",release:"2024",dev:"Indie Studio",platform:"PC",
        price:"$11.99",rating:4.1,players:"Single-player",modes:"KBM",
        tagline:"Rule smart. Expand fast. Outplay the map.",
        overview:"A strategy-forward experience focused on smart expansion, calculated risk, and quick decisions. Build momentum, adapt to threats, and keep your kingdom stable.",
        bullets:["Fast strategy pacing","Meaningful upgrades","Replay-friendly runs","Decisions matter"],
        imgs:["../assets/img/9kings-1.jpg","../assets/img/9kings-2.png","../assets/img/9kings-3.png"]
      },
      gemcraft:{
        title:"Gem Craft",type:"Tower Defense",genre:"Tower Defense",release:"2010",dev:"Game in a Bottle",platform:"PC",
        price:"$9.99",rating:4.4,players:"Single-player",modes:"KBM",
        tagline:"Precision builds, endless waves, pure dopamine.",
        overview:"A tower defense classic where gem combinations define your power. Tune builds, optimize routes, and survive escalating waves designed for theory-crafters.",
        bullets:["Deep upgrade system","Build experimentation","Endless wave challenge","High skill ceiling"],
        imgs:["../assets/img/gemcraft-1.jpg","../assets/img/gemcraft-2.jpg","../assets/img/gemcraft-3.jpg"]
      },
      mariokartworlds:{
        title:"Mario Kart World",type:"Racing",genre:"Racing",release:"2025",dev:"Nintendo",platform:"Console / PC (TBD)",
        price:"$59.99",rating:4.6,players:"Local + Online",modes:"Controller",
        tagline:"Chaos, drift, and friendships you’ll test.",
        overview:"High-speed arcade racing with unpredictable items, tight drift lines, and wild track moments. Perfect for quick sessions or long rivalry nights.",
        bullets:["Arcade racing feel","Local + online play","Item chaos moments","Tracks built for drifting"],
        imgs:["../assets/img/mariokartworld-1.png","../assets/img/mariokartworld-2.jpg","../assets/img/mariokartworld-3.jpg"]
      }
    };

    // normalizeId() cleans and standardizes ids so they match keys in the games object
    const normalizeId=(s)=>{
      const t=(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
      if(t==="9kings") return "9kings";
      if(t==="mariokartworlds"||t==="mariokartworld"||t==="mariokart") return "mariokartworlds";
      if(t==="gemcraft") return "gemcraft";
      if(t==="hollowknight") return "hollowknight";
      if(t==="minecraft") return "minecraft";
      if(t==="destiny2"||t==="destiny") return "destiny2";
      return t;
    };

    const isPlaceholderImagePath=(path)=>{
      const raw=String(path||"").trim().toLowerCase();
      return !raw||raw.includes("your-image-here")||raw.includes("replace-with-image")||raw.includes("placeholder");
    };
    const resolveStoreImage=(path)=>isPlaceholderImagePath(path)?"../assets/img/sale.png":String(path).trim();

    const loadPublisherGames=()=>{
      let records=[];
      try{records=JSON.parse(localStorage.getItem("games_v1")||"[]")}catch{records=[]}
      if(!Array.isArray(records)) return {};

      const mapped={};
      records.forEach((rec,index)=>{
        const key=normalizeId(rec&&rec.storeKey)||normalizeId(`pub${(rec&&rec.title)||"game"}${(rec&&rec.id)||index}`)||`pubgame${index+1}`;
        const priceNum=Number(rec&&rec.price);
        const price=Number.isFinite(priceNum)?`$${priceNum.toFixed(2)}`:"$0.00";
        const image=resolveStoreImage(rec&&rec.imagePath);
        const description=String((rec&&rec.description)||"Publisher listing.");
        const requirements=String((rec&&rec.requirements)||"Requirements not listed.");
        const releaseYear=new Date((rec&&rec.updatedAt)||Date.now()).getFullYear();
        mapped[key]={
          title:String((rec&&rec.title)||`Publisher Game ${index+1}`),
          type:String((rec&&rec.genre)||"Publisher Game")+" • Publisher",
          genre:String((rec&&rec.genre)||"Publisher Game"),
          release:Number.isFinite(releaseYear)?String(releaseYear):"2026",
          dev:String((rec&&rec.publisherName)||"Publisher"),
          platform:"PC",
          price,
          rating: 0,
          players:"Single-player",
          modes:"KBM",
          tagline:description,
          overview:description,
          bullets:[requirements],
          imgs:[image,image,image]
        };
      });
      return mapped;
    };

    const games={...STATIC_GAMES,...loadPublisherGames()};

    // id is the normalized id from the URL, and g is the selected game's data (fallback is destiny2)
    const id=normalizeId(gid),g=games[id]||games.destiny2;

    // Small helper to grab elements by id, like $("gTitle")
    const $=id=>document.getElementById(id);

    // Fill page text using the selected game's data
    $("gTitle").textContent=g.title;
    $("gTagline").textContent=g.tagline;
    $("pillType").textContent=g.type;
    $("pillPrice").textContent=g.price;
    $("priceBig").textContent=g.price;
    $("gStars").innerHTML=stars(g.rating);
    $("ratingBadge").textContent=`${g.rating.toFixed(1)} / 5`;
    $("gPlayers").textContent=g.players;
    $("gModes").textContent=g.modes;
    $("gOverview").textContent=g.overview;
    $("gGenre").textContent=g.genre;
    $("gRelease").textContent=g.release;
    $("gDev").textContent=g.dev;
    $("gPlatform").textContent=g.platform;
    const bulletsEl=$("gBullets");
    const bulletList=Array.isArray(g.bullets)?g.bullets.filter(Boolean):[];
    if(bulletsEl){
      bulletsEl.innerHTML=bulletList.map(t=>`<li class="flex gap-2"><span class="mt-[2px] text-accent">•</span><span>${t}</span></li>`).join("");
      const featuresCard=bulletsEl.closest(".rounded-2xl");
      if(featuresCard) featuresCard.classList.toggle("hidden",bulletList.length===0);
    }

    // Image carousel variables
    let idx=0,timer=null;

    // #imgDots displays small buttons that select which carousel image
    const dots=()=>g.imgs.map((_,i)=>`<button data-dot="${i}" class="h-2 w-2 rounded-full ${i===idx?'bg-accent':'bg-white/20'} hover:bg-white/40 transition"></button>`).join("");

    // setImg() changes the hero image and refreshes dot buttons
    const setImg=i=>{
      idx=(i+g.imgs.length)%g.imgs.length;
      $("heroImg").src=g.imgs[idx];
      $("imgDots").innerHTML=dots();
      document.querySelectorAll("[data-dot]").forEach(b=>b.addEventListener("click",()=>setImg(+b.dataset.dot)));
    };

    // auto() automatically rotates the carousel every 5 seconds
    const auto=()=>{clearInterval(timer);timer=setInterval(()=>setImg(idx+1),5000);};

    // Start carousel and auto-rotate
    setImg(0);auto();

    // Carousel buttons
    $("prevImg").onclick=()=>{setImg(idx-1);auto();};
    $("nextImg").onclick=()=>{setImg(idx+1);auto();};

    // addToCart() adds game to cart; requires login first (for security)
    const addBtnTop=$("addBtnTop");
    const addBtn=$("addBtn");

    if (isPublisherViewOnly) {
      [addBtnTop, addBtn].forEach((btn) => {
        btn.textContent = "View only";
        btn.disabled = true;
        btn.classList.remove("bg-accent", "hover:brightness-110");
        btn.classList.add("border", "border-white/10", "bg-white/5", "text-white/80", "cursor-not-allowed");
      });
    } else {
      addBtnTop.onclick=()=>addToCart(id);
      addBtn.onclick=()=>addToCart(id);
    }

    // Build the mini "More Like This" cards
    const mini=k=>`<article class="reveal shine glass rounded-3xl p-5" data-tilt>
      <p class="text-xs tracking-widest text-white/60">RECOMMENDED</p>
      <h3 class="mt-2 text-lg font-semibold tracking-tight">${games[k].title}</h3>
      <p class="mt-1 text-sm text-white/70">${games[k].tagline}</p>
      <div class="mt-3 flex flex-wrap items-center gap-2 text-xs text-white/70">
        <span class="rounded-full border border-white/10 bg-white/5 px-3 py-1">${games[k].type}</span>
        <span class="flex items-center gap-1 rounded-full border border-white/10 bg-white/5 px-3 py-1">${stars(games[k].rating)}</span>
        <span class="ml-auto rounded-xl bg-accent px-3 py-1 font-semibold text-white">${games[k].price}</span>
      </div>
      <div class="mt-4 overflow-hidden rounded-2xl border border-white/10 bg-black/30">
        <img class="h-40 w-full object-cover transition duration-500 hover:scale-[1.04]" src="${games[k].imgs[0]}" alt="${games[k].title}" />
      </div>
      <div class="mt-4 flex items-center justify-between gap-3">
        <a href="details.html?id=${k}" class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white/80 hover:bg-white/10 hover:text-white transition">Details</a>
        <button data-add="${k}" class="rounded-xl bg-accent px-4 py-2 text-sm font-semibold text-white hover:brightness-110 transition">Add</button>
      </div>
    </article>`;

    // More Like This cards are inserted inside #moreWrap by JS
    const keys=Object.keys(games).filter(k=>k!==id).slice(0,3);
    moreWrap.innerHTML=keys.map(mini).join("");

    // Add buttons in the recommendation cards
    document.querySelectorAll("[data-add]").forEach((b)=>{
      if (isPublisherViewOnly) {
        b.textContent = "View only";
        b.disabled = true;
        b.classList.remove("bg-accent", "hover:brightness-110");
        b.classList.add("border", "border-white/10", "bg-white/5", "text-white/80", "cursor-not-allowed");
        return;
      }
      b.onclick=()=>addToCart(b.dataset.add);
    });

    // The following <div> is the glow for the cursor and follows it
    const glow=document.getElementById("cursorGlow");
    addEventListener("mousemove",e=>{glow.style.left=e.clientX+"px";glow.style.top=e.clientY+"px"},{passive:true});

    // --mx and --my are set by JS and track mouse coordinates for hover shines
    const setVars=(el,e)=>{const r=el.getBoundingClientRect(); el.style.setProperty("--mx",(e.clientX-r.left)+"px"); el.style.setProperty("--my",(e.clientY-r.top)+"px");};

    // data-tilt attribute tells JS which elements to animate on hover
    const tilt=(el,e)=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      el.style.transform=`perspective(900px) rotateX(${(-y*6).toFixed(2)}deg) rotateY(${(x*8).toFixed(2)}deg) translateZ(0)`;};

    // Apply hover tilt to every element with data-tilt
    document.querySelectorAll("[data-tilt]").forEach(el=>{
      el.addEventListener("mousemove",e=>{setVars(el,e);tilt(el,e)},{passive:true});
      el.addEventListener("mouseleave",()=>{el.style.transform="perspective(900px) rotateX(0) rotateY(0)";});
    });

    // The following <div>s display a loading animation when called by JS
    const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add("in")),{threshold:.12});
    document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
    
  </script>
</body>
</html>
