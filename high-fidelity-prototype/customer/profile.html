<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PC+ | Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{teal0:"#041a1a",teal1:"#062626",teal2:"#083535",teal3:"#0b4747",panel:"rgba(255,255,255,.06)",stroke:"rgba(255,255,255,.10)",accent:"#ff7a18"}}}}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet" />
  <style>
    :root{--mx:0;--my:0}
    body{
      font-family:"Yuji Mai",system-ui,sans-serif;
      letter-spacing:.35px;
      background:
        radial-gradient(1200px 700px at 15% 20%, rgba(255,122,24,.18), transparent 55%),
        radial-gradient(900px 600px at 85% 35%, rgba(0,255,200,.10), transparent 60%),
        linear-gradient(120deg,#041a1a,#083535,#062626,#0b4747);
      background-size:100% 100%,100% 100%,300% 300%;
      animation:bg 14s ease-in-out infinite alternate
    }
    @keyframes bg{0%{background-position:0 0,0 0,0% 50%}100%{background-position:0 0,0 0,100% 50%}}
    .glass{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.05));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.10)}
    .shine{position:relative;overflow:hidden}
    .shine:before{content:"";position:absolute;inset:-2px;opacity:0;transition:opacity .18s;pointer-events:none;background:radial-gradient(18px 18px at var(--mx) var(--my), rgba(255,255,255,.10), transparent 70%)}
    .shine:hover:before{opacity:.25}
  </style>
</head>
<body class="min-h-screen text-white selection:bg-accent/30 selection:text-white">
  <div id="cursorGlow" class="pointer-events-none fixed left-0 top-0 rounded-full" style="width:0.12rem;height:0.12rem;opacity:0.035;filter:blur(2px);transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,122,24,.55),rgba(0,255,200,.25),transparent 72%);"></div>

  <header class="sticky top-0 z-50 border-b border-white/10 bg-black/20 backdrop-blur-xl">
    <div class="mx-auto flex max-w-7xl items-center gap-4 px-5 py-4">
      <a class="font-semibold tracking-tight hover:text-white/90 transition" href="customer-home.html">PC<span class="text-accent">+</span></a>
      <nav class="ml-2 flex flex-1 items-center gap-1 text-sm text-white/80">
        <a id="navHome" class="rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="customer-home.html">Home</a>
        <a id="navLibrary" class="rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="library.html">Library</a>
        <a id="navCart" class="rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="cart.html">Cart</a>
        <a id="navProfile" class="rounded-lg px-3 py-2 bg-white/10 text-white transition" href="profile.html">Profile</a>
        <a id="navLogin" class="rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="login.html">Login</a>
        <a id="navPubDashboard" class="hidden rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="../publisher/dashboard.html">Dashboard</a>
        <a id="navPubManage" class="hidden rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="../publisher/manage-games.html">Manage Games</a>
        <a id="navPubUpload" class="hidden rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition" href="../publisher/upload-game.html">Upload Game</a>
        <div class="ml-auto hidden sm:flex items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-3 py-2">
          <svg class="h-4 w-4 text-white/70" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.3-4.3m1.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="searchBox" class="w-56 bg-transparent text-sm outline-none placeholder:text-white/40" placeholder="Search games..." />
        </div>
      </nav>
    </div>
  </header>

  <main class="relative z-10 mx-auto max-w-7xl px-5 pb-16 pt-10">
    <div class="mx-auto max-w-3xl space-y-6">
      <div class="glass rounded-3xl p-5">
        <h1 class="text-3xl sm:text-4xl font-semibold tracking-tight">Profile Settings</h1>
        <p id="statusLine" class="mt-2 text-white/70 text-sm"></p>
      </div>

      <div class="glass rounded-3xl p-5 shine" data-tilt>
        <p class="text-xs tracking-widest text-white/60">PROFILE PICTURE</p>
        <div id="avatarPreview" class="mt-3 flex h-16 w-16 items-center justify-center rounded-full border border-white/20 bg-white/10 text-3xl">🦊</div>
        <div id="avatarOptions" class="mt-4 grid grid-cols-5 gap-2">
          <button type="button" data-avatar="av1" class="avatar-option rounded-xl border border-white/10 bg-white/5 px-2 py-2 text-lg text-white/80 transition hover:bg-white/10">🦊</button>
          <button type="button" data-avatar="av2" class="avatar-option rounded-xl border border-white/10 bg-white/5 px-2 py-2 text-lg text-white/80 transition hover:bg-white/10">🐼</button>
          <button type="button" data-avatar="av3" class="avatar-option rounded-xl border border-white/10 bg-white/5 px-2 py-2 text-lg text-white/80 transition hover:bg-white/10">🐸</button>
          <button type="button" data-avatar="av4" class="avatar-option rounded-xl border border-white/10 bg-white/5 px-2 py-2 text-lg text-white/80 transition hover:bg-white/10">🐯</button>
          <button type="button" data-avatar="av5" class="avatar-option rounded-xl border border-white/10 bg-white/5 px-2 py-2 text-lg text-white/80 transition hover:bg-white/10">🐧</button>
        </div>
      </div>

      <div class="grid gap-5 md:grid-cols-2">
        <section class="glass rounded-3xl p-5 space-y-3">
          <p class="text-xs tracking-widest text-white/60">CHANGE EMAIL</p>
          <input id="changeEmailInput" class="w-full rounded-xl border border-white/10 bg-black/20 px-3 py-2 text-sm outline-none placeholder:text-white/40 focus:border-white/20" placeholder="New email" />
          <input id="changeEmailPin" inputmode="numeric" maxlength="4" class="w-full rounded-xl border border-white/10 bg-black/20 px-3 py-2 text-sm outline-none placeholder:text-white/40 focus:border-white/20" placeholder="Enter 4-digit PIN" />
          <button id="btnChangeEmail" class="w-full rounded-xl bg-accent px-4 py-2 text-sm font-semibold text-white hover:brightness-110 transition">Save Email</button>
        </section>

        <section class="glass rounded-3xl p-5 space-y-3">
          <p class="text-xs tracking-widest text-white/60">CHANGE PASSWORD</p>
          <input id="changePassPin" inputmode="numeric" maxlength="4" class="w-full rounded-xl border border-white/10 bg-black/20 px-3 py-2 text-sm outline-none placeholder:text-white/40 focus:border-white/20" placeholder="Enter 4-digit PIN" />
          <input id="changePassNew" type="password" class="w-full rounded-xl border border-white/10 bg-black/20 px-3 py-2 text-sm outline-none placeholder:text-white/40 focus:border-white/20" placeholder="New password" />
          <button id="btnChangePass" class="w-full rounded-xl bg-accent px-4 py-2 text-sm font-semibold text-white hover:brightness-110 transition">Save Password</button>
        </section>
      </div>

      <section class="glass rounded-3xl p-5 space-y-3">
        <p class="text-xs tracking-widest text-white/60">ACCOUNT TYPE</p>
        <select id="toggleRoleSelect" class="w-full rounded-xl border border-white/10 bg-black/20 px-3 py-2 text-sm outline-none focus:border-white/20">
          <option value="customer">Customer</option>
          <option value="publisher">Publisher</option>
        </select>
        <input id="toggleRolePin" inputmode="numeric" maxlength="4" class="w-full rounded-xl border border-white/10 bg-black/20 px-3 py-2 text-sm outline-none placeholder:text-white/40 focus:border-white/20" placeholder="Enter 4-digit PIN" />
        <button id="btnToggleRole" class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white/80 hover:bg-white/10 hover:text-white transition">Update Account Type</button>
      </section>

      <section id="publisherSettingsBridge" class="hidden glass rounded-3xl p-5">
        <p class="text-xs tracking-widest text-white/60">PUBLISHER SETTINGS</p>
        <p class="mt-2 text-sm text-white/70">Open your publisher-specific settings page for store info and payout details.</p>
        <a href="../publisher/publisher-profile.html" class="mt-4 inline-flex rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white/80 hover:bg-white/10 hover:text-white transition">
          Open Publisher Settings
        </a>
      </section>

      <div class="flex items-center justify-between gap-3">
        <a href="customer-home.html" class="rounded-2xl border border-white/10 bg-white/5 px-5 py-3 text-sm text-white/80 hover:bg-white/10 hover:text-white transition">Back to Home</a>
        <button id="btnLogout" class="rounded-2xl border border-white/10 bg-white/5 px-5 py-3 text-sm text-white/80 hover:bg-white/10 hover:text-white transition">Log out</button>
      </div>

      <p id="msg" class="text-sm text-white/70"></p>
    </div>
  </main>

  <script src="../assets/js/auth.js"></script>
  <script>
    const AVATAR_OPTIONS = (window.PCPlusAuth && window.PCPlusAuth.AVATAR_OPTIONS) || { av1: "🦊", av2: "🐼", av3: "🐸", av4: "🐯", av5: "🐧" };

    const glow = document.getElementById("cursorGlow");
    addEventListener("mousemove", (e) => {
      glow.style.left = e.clientX + "px";
      glow.style.top = e.clientY + "px";
    }, { passive: true });

    const setVars = (el, e) => {
      const r = el.getBoundingClientRect();
      el.style.setProperty("--mx", (e.clientX - r.left) + "px");
      el.style.setProperty("--my", (e.clientY - r.top) + "px");
    };
    document.querySelectorAll("[data-tilt]").forEach((el) => {
      el.addEventListener("mousemove", (e) => setVars(el, e), { passive: true });
    });

    const msg = (t, ok = false) => {
      const el = document.getElementById("msg");
      el.textContent = t || "";
      el.className = "text-sm " + (ok ? "text-emerald-200" : "text-white/70");
    };
    const authErrorText = (code) => {
      const map = {
        invalid_email: "Please enter a valid email.",
        invalid_password: "Please enter a valid password.",
        invalid_role: "Please choose a valid account type.",
        invalid_pin: "PIN must be exactly 4 digits.",
        email_taken: "That email is already used by another account.",
        account_not_found: "No account found for that email.",
        pin_mismatch: "PIN does not match that account.",
        invalid_credentials: "That is not a correct username/password combination."
      };
      return map[code] || "Something went wrong. Please try again.";
    };

    const session = () => (window.PCPlusAuth ? window.PCPlusAuth.getSession() : null);
    const getAvatarId = (email) => (window.PCPlusAuth ? window.PCPlusAuth.getAvatarId(email) : "av1");
    const getAvatarEmoji = (email) => (window.PCPlusAuth ? window.PCPlusAuth.getAvatarEmoji(email) : "🦊");
    const setAvatarId = (email, avatarId) => { if (window.PCPlusAuth) window.PCPlusAuth.setAvatarId(email, avatarId); };
    const normEmail = (e) => (e || "").trim().toLowerCase();

    const current = session();
    if (!(current && current.email)) {
      if (window.PCPlusAuth) window.PCPlusAuth.setNotice("Please log in to continue.");
      location.href = "login.html";
      throw new Error("Login required");
    }

    const navProfile = document.getElementById("navProfile");
    const nav = document.getElementById("navLogin");
    const navRoot = nav ? nav.closest("nav") : null;
    const navSearchWrap = navRoot ? navRoot.querySelector(".ml-auto") : null;
    const searchBox = document.getElementById("searchBox");
    const navHome = document.getElementById("navHome");
    const navLibrary = document.getElementById("navLibrary");
    const navCart = document.getElementById("navCart");
    const navPubDashboard = document.getElementById("navPubDashboard");
    const navPubManage = document.getElementById("navPubManage");
    const navPubUpload = document.getElementById("navPubUpload");
    const pubLinks = [navPubDashboard, navPubManage, navPubUpload];

    const orderNav = (items) => {
      if (!navRoot) return;
      const frag = document.createDocumentFragment();
      items.forEach((el) => { if (el) frag.appendChild(el); });
      if (navSearchWrap) navRoot.insertBefore(frag, navSearchWrap);
      else navRoot.appendChild(frag);
    };

    const renderTopNav = () => {
      const s = session();
      const signedIn = !!(s && s.email);
      const isPublisher = !!(s && s.role === "publisher");
      if (navLibrary) navLibrary.classList.toggle("hidden", isPublisher);
      if (navCart) navCart.classList.toggle("hidden", isPublisher);
      pubLinks.forEach((el) => { if (el) el.classList.toggle("hidden", !isPublisher); });
      if (navSearchWrap) navSearchWrap.classList.toggle("hidden", isPublisher);

      if (searchBox && !isPublisher && !searchBox.dataset.boundEnter) {
        searchBox.addEventListener("keydown", (e) => {
          if (e.key !== "Enter") return;
          e.preventDefault();
          const q = (searchBox.value || "").trim();
          location.href = q ? `customer-home.html?q=${encodeURIComponent(q)}` : "customer-home.html";
        });
        searchBox.dataset.boundEnter = "1";
      }

      if (navProfile) {
        navProfile.classList.toggle("hidden", !signedIn);
        navProfile.href = "profile.html";
      }
      if (!nav) return;
      nav.classList.remove("hidden");
      nav.href = "login.html";
      nav.textContent = signedIn ? `Logged in ${getAvatarEmoji(s.email)}` : "Login";
      if (isPublisher) {
        orderNav(signedIn
          ? [navHome, navPubDashboard, navPubManage, navPubUpload, navProfile, nav]
          : [navHome, navPubDashboard, navPubManage, navPubUpload, nav]);
      } else {
        orderNav(signedIn
          ? [navHome, navLibrary, navCart, navProfile, nav]
          : [navHome, navLibrary, navCart, nav]);
      }
    };

    renderTopNav();

    const statusLine = document.getElementById("statusLine");
    const avatarPreview = document.getElementById("avatarPreview");
    const avatarButtons = Array.from(document.querySelectorAll(".avatar-option"));
    const changeEmailInput = document.getElementById("changeEmailInput");
    const changeEmailPin = document.getElementById("changeEmailPin");
    const btnChangeEmail = document.getElementById("btnChangeEmail");
    const changePassPin = document.getElementById("changePassPin");
    const changePassNew = document.getElementById("changePassNew");
    const btnChangePass = document.getElementById("btnChangePass");
    const toggleRoleSelect = document.getElementById("toggleRoleSelect");
    const toggleRolePin = document.getElementById("toggleRolePin");
    const btnToggleRole = document.getElementById("btnToggleRole");
    const publisherSettingsBridge = document.getElementById("publisherSettingsBridge");
    const btnLogout = document.getElementById("btnLogout");

    let activeAvatar = getAvatarId(current.email);

    const renderAvatarSelection = () => {
      avatarPreview.textContent = AVATAR_OPTIONS[activeAvatar] || AVATAR_OPTIONS.av1;
      avatarButtons.forEach((btn) => {
        const selected = btn.dataset.avatar === activeAvatar;
        btn.classList.toggle("ring-2", selected);
        btn.classList.toggle("ring-accent", selected);
        btn.classList.toggle("bg-white/20", selected);
        btn.classList.toggle("bg-white/5", !selected);
      });
    };

    const refreshProfileState = () => {
      const s = session();
      if (!(s && s.email)) return;
      activeAvatar = getAvatarId(s.email);
      renderAvatarSelection();
      if (toggleRoleSelect) toggleRoleSelect.value = s.role || "customer";
      if (publisherSettingsBridge) publisherSettingsBridge.classList.toggle("hidden", s.role !== "publisher");
      statusLine.textContent = `Signed in as ${s.email} (${s.role}).`;
      renderTopNav();
    };

    avatarButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const s = session();
        if (!(s && s.email)) return;
        activeAvatar = btn.dataset.avatar;
        setAvatarId(s.email, activeAvatar);
        renderAvatarSelection();
        renderTopNav();
        msg("Profile picture updated.", true);
      });
    });

    btnChangeEmail.onclick = () => {
      const s = session();
      if (!(s && s.email)) return msg("Please log in first.");
      const result = window.PCPlusAuth
        ? window.PCPlusAuth.changeEmail({
            currentEmail: s.email,
            pin: (changeEmailPin.value || "").trim(),
            newEmail: normEmail(changeEmailInput.value)
          })
        : { ok: false };
      if (!result.ok) return msg(authErrorText(result.error));
      changeEmailInput.value = "";
      changeEmailPin.value = "";
      refreshProfileState();
      msg("Email updated successfully.", true);
    };

    btnChangePass.onclick = () => {
      const s = session();
      if (!(s && s.email)) return msg("Please log in first.");
      const result = window.PCPlusAuth
        ? window.PCPlusAuth.resetPassword({
            email: s.email,
            pin: (changePassPin.value || "").trim(),
            newPassword: changePassNew.value || ""
          })
        : { ok: false };
      if (!result.ok) return msg(authErrorText(result.error));
      changePassPin.value = "";
      changePassNew.value = "";
      msg("Password updated successfully.", true);
    };

    const applyRoleChange = () => {
      const s = session();
      if (!(s && s.email)) return msg("Please log in first.");
      const result = window.PCPlusAuth
        ? window.PCPlusAuth.changeRole({
            email: s.email,
            pin: (toggleRolePin.value || "").trim(),
            role: toggleRoleSelect.value
          })
        : { ok: false };
      if (!result.ok) return msg(authErrorText(result.error));
      toggleRolePin.value = "";
      refreshProfileState();
      msg("Account type updated successfully.", true);
    };
    btnToggleRole.onclick = applyRoleChange;
    toggleRoleSelect.addEventListener("change", () => {
      const pin = (toggleRolePin.value || "").trim();
      if (!pin) return msg("Enter your 4-digit PIN, then switch the account type.");
      applyRoleChange();
    });

    btnLogout.onclick = () => {
      if (window.PCPlusAuth) window.PCPlusAuth.logout();
      location.href = "login.html";
    };

    refreshProfileState();
  </script>
</body>
</html>
