<!doctype html>
<!-- (This tells the browser we are using modern HTML) -->

<html lang="en">
<!-- (The root element of the page, lang="en" helps accessibility tools know what language this is)) -->

<head>
  <!-- (page setup info & imports live here) -->

  <meta charset="UTF-8" />
  <!-- (tells the browser what character encoding we’re using) -->

  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- (makes the page mobile responsive) -->

  <title>PC+ | Home</title>
  <!-- (The text shown in the browser tab) -->

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- (Imports Tailwind CSS from a CDN) -->

  <script>
    /* (Configure Tailwind to extend our color theme with custom names) */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            /* (Use this teal palette as our main theme background color) */
            teal0: "#041a1a",
            teal1: "#062626",
            teal2: "#083535",
            teal3: "#0b4747",

            /* (Use these semi-transparent colors for “glass” panels and borders) */
            panel: "rgba(255,255,255,.06)",
            stroke: "rgba(255,255,255,.10)",

            /* (Use this accent color for buttons and highlights) */
            accent: "#ff7a18"
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <!-- (Make Google Font connections load faster) -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- (Allow cross-origin loading of Google Fonts needed for this site) -->

  <link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet" />
  <!-- (Import Yuji Mai Google Font, make use of it in the site) -->

  <style>
    /* (Store cursor coordinates as CSS variables to make hover-glow follow mouse) */
    :root { --mx: 0; --my: 0; }

    html {
      background: #041a1a;
      overscroll-behavior: none;
    }

    body {
      /* (Set this font as default for the entire site) */
      font-family: "Yuji Mai", system-ui, sans-serif;

      /* (Slight spacing between letters for a stylized look) */
      letter-spacing: .35px;

      /* (Apply multiple background layers, including a large gradient that animates) */
      background:
        radial-gradient(1200px 700px at 15% 20%, rgba(255,122,24,.18), transparent 55%),
        radial-gradient(900px 600px at 85% 35%, rgba(0,255,200,.10), transparent 60%),
        linear-gradient(120deg, #041a1a, #083535, #062626, #0b4747);

      /* (Apply a large background gradient that will animate for hover effects) */
      background-size: 100% 100%, 100% 100%, 300% 300%;

      /* (Animation that shifts the background gradient back and forth) */
      animation: bg 14s ease-in-out infinite alternate;
    }

    /* (Use this keyframes animation to create a shifting gradient effect on hover) */
    @keyframes bg {
      0%   { background-position: 0 0, 0 0, 0% 50%; }
      100% { background-position: 0 0, 0 0, 100% 50%; }
    }

    /* (Create a “glass” effect on .glass elements (behind them has to be blurred too!)) */
    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.10);
    }

    /* (Apply this effect to create a frosted glass look) */
    .shine {
      position: relative;
      overflow: hidden;
    }

    /* (Display an overlay that follows the mouse position to simulate hover “shine” on .hover-shine elements)
       (Make the hover “shine” a little visible, see next comment for more info!)
       On .hover-shine + :hover it makes the “glow” slightly visible (almost transparent) */
    .shine:before {
      content: "";
      position: absolute;
      inset: -2px;
      opacity: 0;
      transition: opacity .18s;
      pointer-events: none;

      background: radial-gradient(
        100px 100px at var(--mx) var(--my),
        rgba(255,255,255,.10),
        transparent 70%
      );
    }

    /* When hovering, make the glow overlay slightly visible (almost transparent) */
    .shine:hover:before { opacity: .25; }

    /* (Set starting properties for .reveal so it can smoothly animate when scrolling down) */
    .reveal {
      opacity: 0;
      transform: translateY(10px) scale(.98);
      filter: blur(6px);
    }

    /* (This is what it looks like after animating, when adding .in + transition properties) */
    .reveal.in {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
      transition: opacity .7s, transform .7s, filter .7s;
    }
  </style>
</head>

  <script src="../assets/js/auth.js"></script>
  <script>
    // Function to display a “toast” message which appears briefly then disappears.
    const toast = (t) => {
      const el = document.getElementById("toast");   // Helper variable to grab #toast container element.
      el.textContent = t;                            // #toast container will display this message text.
      el.classList.remove("hidden");                 // Show the #toast container to display it.

      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.add("hidden"), 950);
    };

    const session = () => (window.PCPlusAuth ? window.PCPlusAuth.getSession() : null);
    const getAvatarEmoji = (email) => (window.PCPlusAuth ? window.PCPlusAuth.getAvatarEmoji(email) : "🦊");

    // Function to check if there is login session data inside local storage.
    const isLoggedIn = () => {
      const s = session();
      return !!(s && s.email && s.role === "customer"); // Returns true only for customer sessions.
    };

    // Get navigation bar links and set role-aware menu state.
    const nav = document.getElementById("navLogin");
    const navRoot = nav ? nav.closest("nav") : null;
    const navSearchWrap = navRoot ? navRoot.querySelector(".ml-auto") : null;
    const navHome = document.getElementById("navHome");
    const navLibrary = document.getElementById("navLibrary");
    const navCart = document.getElementById("navCart");
    const navPubDashboard = document.getElementById("navPubDashboard");
    const navPubManage = document.getElementById("navPubManage");
    const navPubUpload = document.getElementById("navPubUpload");
    const navPubProfile = document.getElementById("navPubProfile");
    const pubLinks = [navPubDashboard, navPubManage, navPubUpload, navPubProfile];

    const orderNav = (items) => {
      if (!navRoot) return;
      const frag = document.createDocumentFragment();
      items.forEach((el) => {
        if (!el) return;
        frag.appendChild(el);
      });
      if (navSearchWrap) navRoot.insertBefore(frag, navSearchWrap);
      else navRoot.appendChild(frag);
    };

    // Get current login session data, only needs to be retrieved once.
    const s = session();
    const isPublisher = !!(s && s.role === "publisher");

    if (navLibrary) navLibrary.classList.toggle("hidden", isPublisher);
    if (navCart) navCart.classList.toggle("hidden", isPublisher);
    pubLinks.forEach((el) => {
      if (el) el.classList.toggle("hidden", !isPublisher);
    });

    if (nav) {
      nav.classList.remove("hidden");
      nav.textContent = (s && s.email) ? ("Logged in " + getAvatarEmoji(s.email)) : "Login";
      nav.href = "login.html";
    }

    if (isPublisher) {
      orderNav([navHome, navPubDashboard, navPubManage, navPubUpload, navPubProfile, nav]);
    } else {
      orderNav([navHome, navLibrary, navCart, nav]);
    }
    const loadCart = () => {
      try {
        return JSON.parse(localStorage.getItem("pcplus_cart") || "[]");
      } catch {
        return []; // If localStorage doesn’t have any cart data yet, return an empty array instead.
      }
    };

    // Save data inside cart back into localStorage, whenever there's a change in cart.
    const saveCart = (a) => localStorage.setItem("pcplus_cart", JSON.stringify(a || []));

    const requireLogin = (actionLabel) => {
      // Require user to be logged in before performing certain actions like adding to cart.
      if (isLoggedIn()) return true;                      // User is already logged in and session exists in local storage.
      toast(`Please log in with a customer account to ${actionLabel}.`); // Show message prompting user to log in before performing action.
      setTimeout(() => location.href = "login.html", 700); // Redirect user to login page since they must be logged in first.
      return false;
    };

    const addToCart = (id) => {
      // Add an item with id into the cart stored inside localStorage. ID should be unique!
      // Check if user is logged in before allowing them to add item to shopping cart.
      if (!requireLogin("add items to your cart")) return; // Don't add item to cart if user isn't logged in yet.

      const c = loadCart();                                // Load data from cart inside localStorage (can be used across sessions!)
      c.push(id);                                          // Add item ID into user’s shopping cart stored locally on their machine!
      saveCart(c);                                         // Save data inside cart back into localStorage, whenever there's a change in cart.
      toast("Added to cart");                              // Display success message that item was successfully added into user's shopping cart!
    };

    const star = (f) => `
      <svg class="h-4 w-4 ${f ? 'text-accent' : 'text-white/25'}" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 17.3l-6.18 3.64 1.64-7.03L2 9.24l7.19-.61L12 2l2.81 6.63 7.19.61-5.46 4.67 1.64 7.03z"/>
      </svg>
    `; // One star shape of 5 filled or not filled depending on rating/f (boolean).

    const stars = (n) => `
      <span class="flex items-center">
        ${Array.from({ length: 5 }, (_, i) => star(i < n)).join("")}
      </span>
      <span class="ml-2 text-white/60">${n.toFixed(1)}</span>
    `; // Five star rating that displays star shapes and numeric rating value after stars.

    const card = (g, opt = {}) => `
      <article class="reveal shine glass rounded-3xl p-5 ${opt.big ? 'md:col-span-6' : ''}" data-tilt>
        <div class="min-w-0">
          ${opt.tag ? `
            <span class="inline-flex items-center rounded-full border border-white/10 bg-white/5 px-3 py-1 text-[11px] tracking-widest text-white/70">
              ${opt.tag}
            </span>
          ` : ""}

          <h3 class="truncate ${opt.tag ? 'mt-2' : ''} text-lg font-semibold tracking-tight">${g.title}</h3>
          <p class="mt-1 text-sm text-white/70">${g.blurb}</p>

          <div class="mt-3 flex flex-wrap items-center gap-2 text-xs text-white/70">
            <span class="rounded-full border border-white/10 bg-white/5 px-3 py-1">${g.type}</span>
            <span class="flex items-center gap-1 rounded-full border border-white/10 bg-white/5 px-3 py-1">${stars(g.rating)}</span>
            <span class="ml-auto rounded-xl bg-accent px-3 py-1 font-semibold text-white">${g.price}</span>
          </div>
        </div>

        <div class="mt-4 overflow-hidden rounded-2xl border border-white/10 bg-black/30">
          <img class="h-40 w-full object-cover transition duration-500 hover:scale-[1.04]" src="${g.img}" alt="${g.title}" />
        </div>

        <div class="mt-4 flex items-center justify-between gap-3">
          <a href="details.html?id=${g.id}" class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white/80 hover:bg-white/10 hover:text-white transition">
            Details
          </a>
          <button data-add="${g.id}" class="rounded-xl bg-accent px-4 py-2 text-sm font-semibold text-white hover:brightness-110 transition">
            Add
          </button>
        </div>
      </article>
    `; // This function generates one card tile for all grid display areas throughout site.

    const featured = {
      id: "gemcraft",
      title: "Gem Craft",
      type: "Tower Defense",
      rating: 4.4,
      price: "$9.99",
      desc: "Precision builds, endless waves, and tower-defense strategy.",
      players: "Single-player",
      platform: "PC",
      release: "2010",
      bullets: ["Build powerful gem towers", "Mix upgrades to counter waves", "Classic strategy progression"],
      imgs: ["../assets/img/gemcraft-1.jpg", "../assets/img/gemcraft-2.jpg", "../assets/img/gemcraft-3.jpg"]
    }; // Holds multiple images of featured game to make cool slideshow effect possible!

    const recommended = [
      { id: "hollowknight", title: "Hollow Knight", type: "Metroidvania", rating: 4.8, price: "$14.99", blurb: "Gorgeous, brutal, and beautifully quiet.", img: "../assets/img/hollowknight-1.jpg" },
      { id: "minecraft", title: "Minecraft", type: "Sandbox", rating: 4.9, price: "$29.99", blurb: "Build anything. Survive everything. Forever.", img: "../assets/img/minecraft-1.jpg" }
    ]; // List of recommended cards (only fewest with most important info).

    const sale = [
      { id: "destiny2", title: "Destiny 2", type: "Shooter • MMO", rating: 4.2, price: "$0.00", blurb: "Raids, strikes, PvP, and a galaxy of loot.", img: "../assets/img/destiny2-1.jpg" },
      { id: "hollowknight", title: "Hollow Knight", type: "Metroidvania", rating: 4.8, price: "$14.99", blurb: "A haunting world with perfect combat feel.", img: "../assets/img/hollowknight-1.jpg" },
      { id: "minecraft", title: "Minecraft", type: "Sandbox", rating: 4.9, price: "$29.99", blurb: "Creative mode to survival sweats in seconds.", img: "../assets/img/minecraft-1.jpg" },
      { id: "9kings", title: "9 Kings", type: "Strategy", rating: 4.1, price: "$11.99", blurb: "Rule smart. Expand fast. Outplay the map.", img: "../assets/img/9kings-1.jpg" },
      { id: "gemcraft", title: "Gem Craft", type: "Tower Defense", rating: 4.4, price: "$9.99", blurb: "Precision builds, endless waves, pure dopamine.", img: "../assets/img/gemcraft-1.jpg" },
      { id: "mariokartworlds", title: "Mario Kart World", type: "Racing", rating: 4.6, price: "$59.99", blurb: "Chaos, drift, and friendships you’ll test.", img: "../assets/img/mariokartworld-1.png" }
    ]; // List of sale cards being displayed in grid location according to site design plan..

    const normalizeStoreKey = (value) => String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    const isPlaceholderImagePath = (path) => {
      const raw = String(path || "").trim().toLowerCase();
      return !raw || raw.includes("your-image-here") || raw.includes("replace-with-image") || raw.includes("placeholder");
    };
    const resolveStoreImage = (path) => (isPlaceholderImagePath(path) ? "../assets/img/sale.png" : String(path).trim());

    const loadPublisherSaleCards = () => {
      let records = [];
      try {
        records = JSON.parse(localStorage.getItem("games_v1") || "[]");
      } catch {
        records = [];
      }
      if (!Array.isArray(records)) return [];

      return records
        .map((rec, index) => {
        const rawPrice = Number(rec && rec.price);
        const price = Number.isFinite(rawPrice) ? rawPrice : 0;
        const storeKey =
          normalizeStoreKey(rec && rec.storeKey) ||
          normalizeStoreKey(`pub${(rec && rec.title) || "game"}${(rec && rec.id) || index}`) ||
          `pubgame${index + 1}`;
        return {
          id: storeKey,
          title: String((rec && rec.title) || `Publisher Game ${index + 1}`),
          type: String((rec && rec.genre) || "Publisher Game") + " • Publisher",
          rating: 0,
          price: `$${price.toFixed(2)}`,
          blurb: String((rec && rec.description) || "New listing from publisher tools."),
          img: resolveStoreImage(rec && rec.imagePath)
        };
      });
    };

    const heroHeadline = document.getElementById("heroHeadline");
    const heroPromo = document.getElementById("heroPromo");
    const featuredTile = document.getElementById("featuredTile");
    const recWrapEl = document.getElementById("recWrap");
    const saleWrapEl = document.getElementById("saleWrap");
    const featAddBtn = document.getElementById("featAdd");
    const searchInputs = Array.from(
      new Set(
        [
          document.getElementById("searchBox"),
          ...document.querySelectorAll('input[placeholder="Search games..."]')
        ].filter(Boolean)
      )
    );
    const searchBox = searchInputs[0] || null;

    const viewOnlyMode = !!(s && s.role === "publisher");
    const saleFeed = sale.concat(loadPublisherSaleCards());

    // (Updates the featured tile with info provided by global list "featured" and index i)
    // i = determines which image from featured.imgs list should be displayed.
    const setFeat = (i) => {
      featTitle.textContent = featured.title;
      featDesc.textContent = featured.desc;
      featType.textContent = featured.type;
      featPrice.textContent = featured.price;
      featStars.innerHTML = stars(featured.rating);

      featImg.src = featured.imgs[i % featured.imgs.length];

      featPlayers.textContent = featured.players;
      featPlatform.textContent = featured.platform;
      featRelease.textContent = featured.release;

      featBullets.innerHTML = featured.bullets
        .map(t => `<li class="flex gap-2"><span class="mt-[2px] text-accent">•</span><span>${t}</span></li>`)
        .join("");
    };

    // Title-only matching with spacing/punctuation tolerance (GemCraft -> Gem Craft).
    const normalizeText = (value) =>
      String(value || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    const compactText = (value) => normalizeText(value).replace(/[^a-z0-9]/g, "");
    const escapeHtml = (value) =>
      String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");

    const normalizeQuery = () => {
      for (const input of searchInputs) {
        const q = String(input?.value || "").trim();
        if (q) return q;
      }
      return "";
    };

    const matchesQuery = (g, query) => {
      const rawQuery = String(query || "").trim();
      if (!rawQuery) return true;

      const title = String((g && g.title) || "");
      const titleNorm = normalizeText(title);
      const titleCompact = compactText(title);
      const queryNorm = normalizeText(rawQuery);
      const queryCompact = compactText(rawQuery);

      if (queryNorm && titleNorm.includes(queryNorm)) return true;
      if (queryCompact && titleCompact.includes(queryCompact)) return true;
      return false;
    };

    const applyCardActions = () => {
      if (featAddBtn) {
        if (viewOnlyMode) {
          featAddBtn.textContent = "View only";
          featAddBtn.disabled = true;
          featAddBtn.classList.remove("bg-accent", "hover:brightness-110");
          featAddBtn.classList.add("border", "border-white/10", "bg-white/5", "text-white/80", "cursor-not-allowed");
        } else {
          featAddBtn.textContent = "Add to Cart";
          featAddBtn.disabled = false;
          featAddBtn.classList.remove("border", "border-white/10", "bg-white/5", "text-white/80", "cursor-not-allowed");
          featAddBtn.classList.add("bg-accent", "hover:brightness-110");
          featAddBtn.onclick = () => addToCart(featured.id);
        }
      }

      document.querySelectorAll("[data-add]").forEach((b) => {
        if (viewOnlyMode) {
          b.textContent = "View only";
          b.disabled = true;
          b.classList.remove("bg-accent", "hover:brightness-110");
          b.classList.add("border", "border-white/10", "bg-white/5", "text-white/80", "cursor-not-allowed");
          return;
        }
        b.textContent = "Add";
        b.disabled = false;
        b.classList.remove("border", "border-white/10", "bg-white/5", "text-white/80", "cursor-not-allowed");
        b.classList.add("bg-accent", "hover:brightness-110");
        b.onclick = () => addToCart(b.dataset.add);
      });
    };

    const renderHomeLists = () => {
      const q = normalizeQuery();
      const hasSearchText = q.length > 0;
      const rawRecommended = recommended.filter((g) => matchesQuery(g, q));
      const rawSaleFeed = saleFeed.filter((g) => matchesQuery(g, q));

      let filteredRecommended = rawRecommended;
      let filteredSaleFeed = rawSaleFeed;

      // Only de-duplicate while actively searching. Priority order: recommended -> sale.
      if (q) {
        const seenTitles = new Set();
        const titleKey = (g) => normalizeText(g && g.title);

        filteredRecommended = rawRecommended.filter((g) => {
          const key = titleKey(g);
          if (!key || seenTitles.has(key)) return false;
          seenTitles.add(key);
          return true;
        });

        filteredSaleFeed = rawSaleFeed.filter((g) => {
          const key = titleKey(g);
          if (!key || seenTitles.has(key)) return false;
          seenTitles.add(key);
          return true;
        });
      }

      const showNoResults = hasSearchText && filteredRecommended.length === 0 && filteredSaleFeed.length === 0;

      if (heroHeadline) heroHeadline.classList.toggle("hidden", hasSearchText);
      if (heroPromo) heroPromo.classList.toggle("hidden", hasSearchText);
      if (featuredTile) featuredTile.classList.toggle("hidden", hasSearchText);
      if (!hasSearchText) setFeat(fi);
      if (recWrapEl) recWrapEl.innerHTML = filteredRecommended.map(g => card(g, { big: true, tag: "RECOMMENDED" })).join("");
      if (saleWrapEl) {
        saleWrapEl.innerHTML = showNoResults
          ? `
            <div class="sm:col-span-2 lg:col-span-3 rounded-2xl border border-white/10 bg-white/[0.04] p-5 text-sm text-white/75">
              No results for "<span class="text-white">${escapeHtml(q)}</span>".
            </div>
          `
          : filteredSaleFeed.map(g => card(g)).join("");
      }

      // Newly rendered cards should be visible immediately after filtering.
      [recWrapEl, saleWrapEl].forEach((root) => {
        if (!root) return;
        root.querySelectorAll(".reveal").forEach((el) => el.classList.add("in"));
      });

      applyCardActions();
    };

    // (Slideshow containing multiple images of featured tile being displayed one at a time).
    let fi = 0;

    setFeat(fi);

    // (Sets same info as above after cycling through images every 5 seconds).
    setInterval(() => setFeat(++fi), 5000);

    const searchParams = new URLSearchParams(location.search);
    const initialQuery = (searchParams.get("q") || "").trim();
    if (initialQuery) {
      searchInputs.forEach((input) => {
        input.value = initialQuery;
      });
    }

    renderHomeLists();
    searchInputs.forEach((input) => {
      ["input", "change", "keyup"].forEach((evt) => {
        input.addEventListener(evt, () => {
          searchInputs.forEach((other) => {
            if (other !== input) other.value = input.value;
          });
          renderHomeLists();
        });
      });
    });

    // Changes cursorGlow locations relative to x & y value passed to this function (local var 'elem' gets each HTML Element w/ class "hover-glow")
    const glow = document.getElementById("cursorGlow");
    addEventListener("mousemove", e => {
      glow.style.left = e.clientX + "px";
      glow.style.top = e.clientY + "px";
    }, { passive: true });

    const setVars = (el, e) => {
      // Set relative positions within hovered item using bounding client rectangle coords!
      const r = el.getBoundingClientRect();
      el.style.setProperty("--mx", (e.clientX - r.left) + "px");
      el.style.setProperty("--my", (e.clientY - r.top) + "px");
      // Uses these relative positions as parameters passed to make it tilt! (mouseHoverParams)
    };

    const tilt = (el, e) => {
      // Uses a 3D perspective and rotations, tilting the hovered-over object (const vars "rotateAmt" & "perspective" control degrees of tilting/rotation)
      const r = el.getBoundingClientRect();

      // Converts x & y mouse coords on hovered item into range from -0.5 upto +0.5
      const x = (e.clientX - r.left) / r.width - .5;
      const y = (e.clientY - r.top) / r.height - .5;

      // Makes hovered item tilt towards mouse cursor position (return tilt parameters)
      el.style.transform =
        `perspective(900px) rotateX(${(-y * 8).toFixed(2)}deg) rotateY(${(x * 10).toFixed(2)}deg) translateZ(0)`;
    };

    // (Makes each item w/ data-tilt attribute listen for mouse events!
    // Calls mouseHoverGlow() & mouseEnterTilt() functions when conditions are met)
    document.querySelectorAll("[data-tilt]").forEach(el => {
      el.addEventListener("mousemove", e => { setVars(el, e); tilt(el, e); }, { passive: true });
      el.addEventListener("mouseleave", () => {
        el.style.transform = "perspective(900px) rotateX(0) rotateY(0)";
      });
    });

    // Listens for each element w/ class 'reveal' when its scrolled into view (Intersection Observer activates!!)
    const io = new IntersectionObserver(
      es => es.forEach(e => e.isIntersecting && e.target.classList.add("in")),
      { threshold: .12 }
    );

    // When an observable element intersects w/ viewport(long-thin box), call callback function!!
    // Add CSS class 'in' which triggers transition animation ONLY WHEN scrolling into view!!
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));

    // (Determines if tiles reveal w/ animation only if scroll animation triggers it!)
    // (Lines 102 - 174 contain extra added comments not in original script!)
    // (WARNING: Everything from lines 176 - 270 contains TS comments/questions!)
  </script>
</body>
</html>
