# -------------------------------------------------------------
# PC+ Backend API (CSC 340 Milestone)
#
# IMPORTANT:
# - Do not commit real Neon credentials.
# - Set these environment variables locally before running:
#     NEON_DB_URL
#     NEON_DB_USERNAME
#     NEON_DB_PASSWORD
#
# Example URL format:
# jdbc:postgresql://ep-xxxxx.us-east-2.aws.neon.tech/neondb?sslmode=require
# -------------------------------------------------------------

spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${NEON_DB_URL:jdbc:postgresql://localhost:5432/pcplus}
spring.datasource.username=${NEON_DB_USERNAME:postgres}
spring.datasource.password=${NEON_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080
pcplus.cors.allowed-origin=http://localhost:3000

pcplus.jwt.secret=PCPlusSecretKey_ChangeThisInProduction_CSC340_Group4_2026
pcplus.jwt.expiration-ms=86400000

# SQL logging for milestone demos (comment out if too noisy)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.com.pcplus=DEBUG
logging.level.org.springframework.security=WARN
