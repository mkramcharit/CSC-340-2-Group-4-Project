  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{
      teal0:"#041a1a",teal1:"#062626",teal2:"#083535",teal3:"#0b4747",
      panel:"rgba(255,255,255,.06)",stroke:"rgba(255,255,255,.10)",accent:"#ff7a18"

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    :root { --mx: 0; --my: 0; }

    html { background: #041a1a; overscroll-behavior: none; }

    body {
      font-family: "Yuji Mai", system-ui, sans-serif;
      letter-spacing: .35px;
      background:
        radial-gradient(1200px 700px at 15% 20%, rgba(255,122,24,.18), transparent 55%),
        radial-gradient(900px 600px at 85% 35%, rgba(0,255,200,.10), transparent 60%),
        linear-gradient(120deg, #041a1a, #083535, #062626, #0b4747);
      background-size: 100% 100%, 100% 100%, 300% 300%;
      animation: bg 14s ease-in-out infinite alternate;
    }

    @keyframes bg {
      0%   { background-position: 0 0, 0 0, 0% 50%; }
      100% { background-position: 0 0, 0 0, 100% 50%; }
    }

    .glass {
      background: linear-gradient(160deg, rgba(255,255,255,.11), rgba(255,255,255,.05));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.12);
      transition: border-color .22s, box-shadow .22s, transform .22s;
    }
    .glass:hover {
      border-color: rgba(255,255,255,.2);
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
    }

    .shine { position: relative; overflow: hidden; }
    .shine:before {
      content: "";
      position: absolute;
      inset: -2px;
      opacity: 0;
      transition: opacity .18s;
      pointer-events: none;
      background: radial-gradient(100px 100px at var(--mx) var(--my), rgba(255,255,255,.10), transparent 70%);
    }
    .shine:hover:before { opacity: .25; }

    .reveal {
      opacity: 0;
      transform: translateY(12px) scale(.98);
      filter: blur(5px);
    }
    .reveal.in {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
      transition: opacity .65s cubic-bezier(.4,0,.2,1),
                  transform .65s cubic-bezier(.4,0,.2,1),
                  filter .65s cubic-bezier(.4,0,.2,1);
    }

    #mobileNavBtn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 38px; height: 38px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
      transition: background .18s;
    }
    #mobileNavBtn:hover { background: rgba(255,255,255,.14); }

    @media (max-width: 639px) {
      #mobileNavBtn { display: flex; }

      nav.ml-2 {
        position: absolute;
        top: 100%;
        left: 0; right: 0;
        flex-direction: column;
        align-items: stretch;
        background: rgba(4, 20, 20, 0.97);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255,255,255,.10);
        padding: 8px 12px 12px;
        gap: 3px;
        z-index: 48;
        animation: navDown .2s ease both;
        display: none;
      }
      nav.ml-2.mob-open { display: flex; }

      nav.ml-2 a {
        padding: 11px 14px !important;
        border-radius: 14px !important;
        font-size: 15px !important;
        width: 100%;
      }

      nav.ml-2 .ml-auto { display: none; }
      #mobileSearchBtn { display: flex !important; }
    }

    @keyframes navDown {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  <script>
    const toast=(t,tone="info")=>{
      const el=document.getElementById("toast");
      const success=tone==="success";
      el.textContent=success?`\u2714 ${t}`:t;
      el.classList.remove(
        "border-emerald-300/60",
        "bg-emerald-500/20",
        "text-emerald-100",
        "shadow-lg",
        "shadow-emerald-950/40"
      );
      if(success){
        el.classList.add(
          "border-emerald-300/60",
          "bg-emerald-500/20",
          "text-emerald-100",
          "shadow-lg",
          "shadow-emerald-950/40"
        );
      }
      el.classList.remove("hidden");
      clearTimeout(toast._t);
      toast._t=setTimeout(()=>el.classList.add("hidden"),950);
    };

    const session=()=>window.PCPlusAuth?window.PCPlusAuth.getSession():null;
    const getAvatarEmoji=(email)=>window.PCPlusAuth?window.PCPlusAuth.getAvatarEmoji(email):"🦊";

    const s=session();

    const navProfile=document.getElementById("navProfile");
    const nav=document.getElementById("navLogin");
    const navRoot=nav?nav.closest("nav"):null;
    const navSearchWrap=navRoot?navRoot.querySelector(".ml-auto"):null;
    const searchBox=document.getElementById("searchBox");
    const runHomeSearchRedirect=()=>{
      const q=(searchBox?.value||"").trim();
      location.href=q?`customer-home.html?q=${encodeURIComponent(q)}`:"customer-home.html";
    };
    if(searchBox){
      searchBox.addEventListener("keydown",(e)=>{
        if(e.key!=="Enter") return;
        e.preventDefault();
        runHomeSearchRedirect();
      });
    }
    const navHome=document.getElementById("navHome");
    const navLibrary=document.getElementById("navLibrary");
    const navCart=document.getElementById("navCart");
    const navPubDashboard=document.getElementById("navPubDashboard");
    const navPubManage=document.getElementById("navPubManage");
    const navPubUpload=document.getElementById("navPubUpload");
    const pubLinks=[navPubDashboard,navPubManage,navPubUpload];

    const orderNav=(items)=>{
      if(!navRoot) return;
      const frag=document.createDocumentFragment();
      items.forEach((el)=>{
        if(!el) return;
        frag.appendChild(el);
      });
      if(navSearchWrap) navRoot.insertBefore(frag,navSearchWrap);
      else navRoot.appendChild(frag);
    };

    const isPublisherViewOnly=!!(s&&s.role==="publisher");
    const signedIn=!!(s&&s.email);
    if(navLibrary) navLibrary.classList.toggle("hidden",isPublisherViewOnly);
    if(navCart) navCart.classList.toggle("hidden",isPublisherViewOnly);
    pubLinks.forEach((el)=>{ if(el) el.classList.toggle("hidden",!isPublisherViewOnly); });
    if(navSearchWrap) navSearchWrap.classList.toggle("hidden",isPublisherViewOnly);

    if(nav){
      nav.classList.remove("hidden");
      nav.href="login.html";
      nav.textContent=signedIn?("Logged in "+getAvatarEmoji(s.email)):"Login";
    }
    if(navProfile){
      navProfile.classList.toggle("hidden",!signedIn);
      navProfile.href="profile.html";
    }

    if(isPublisherViewOnly){
      orderNav(signedIn
        ? [navHome,navPubDashboard,navPubManage,navPubUpload,navProfile,nav]
        : [navHome,navPubDashboard,navPubManage,navPubUpload,nav]);
    }else{
      orderNav(signedIn
        ? [navHome,navLibrary,navCart,navProfile,nav]
        : [navHome,navLibrary,navCart,nav]);
    }
    const isLoggedIn=()=>{const ss=session(); return !!(ss&&ss.email&&ss.role==="customer");};

    const loadCart=()=>{try{return JSON.parse(localStorage.getItem("pcplus_cart")||"[]")}catch{return []}};

    const saveCart=(a)=>localStorage.setItem("pcplus_cart",JSON.stringify(a||[]));

    const requireLogin=(actionLabel)=>{
      if(isLoggedIn()) return true;
      toast(`Please log in with a customer account to ${actionLabel}.`);
      setTimeout(()=>location.href="login.html",700);
      return false;
    };

    const addToCart=(id)=>{
      if(isPublisherViewOnly){
        toast("Publisher accounts can view details but cannot purchase.");
        return;
      }
      if(!requireLogin("add items to your cart")) return;
      const c=loadCart(); c.push(id); saveCart(c);
      toast("Added to cart","success");
    };

    const qs=new URLSearchParams(location.search);

    const gid=(qs.get("id")||"destiny2").toLowerCase().replace(/[^a-z0-9]/g,"");

    const star=f=>`<svg class="h-4 w-4 ${f?'text-accent':'text-white/25'}" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.3l-6.18 3.64 1.64-7.03L2 9.24l7.19-.61L12 2l2.81 6.63 7.19.61-5.46 4.67 1.64 7.03z"/></svg>`;

    const stars=n=>`<span class="flex items-center">${Array.from({length:5},(_,i)=>star(i<n)).join("")}</span><span class="ml-2 text-white/60">${n.toFixed(1)}</span>`;

    const STATIC_GAMES={
      destiny2:{
        title:"Destiny 2",type:"Shooter • MMO",genre:"Action / FPS",release:"2017",dev:"Bungie",platform:"PC",
        price:"$0.00",rating:4.2,players:"Co-op + PvP",modes:"Controller • KBM",
        tagline:"Co-op raids, PvP, and endless loot. Jump in fast.",
        overview:"Enter a living sci-fi universe packed with raids, strikes, seasonal events, and competitive PvP. Chase new gear, tune your build, and team up for endgame moments that feel cinematic.",
        bullets:["Raid-ready co-op activities","Build crafting and loot chase","PvP playlists + events","Seasonal content drops"],
        imgs:["../assets/img/destiny21.jpg","../assets/img/destiny22.jpg","../assets/img/destiny23.jpg"]
      },
      hollowknight:{
        title:"Hollow Knight",type:"Metroidvania",genre:"Action / Adventure",release:"2017",dev:"Team Cherry",platform:"PC",
        price:"$14.99",rating:4.8,players:"Single-player",modes:"Controller • KBM",
        tagline:"Gorgeous, brutal, and beautifully quiet.",
        overview:"Explore a haunting underground kingdom. Master tight combat, uncover hidden routes, and chase secrets through hand-crafted zones that reward patience and curiosity.",
        bullets:["Tight, responsive combat","Deep exploration with secrets","Boss fights that test skill","Atmospheric hand-drawn world"],
        imgs:["../assets/img/hollowknight1.jpg","../assets/img/hollowknight2.jpeg","../assets/img/hollowknight3.jpg"]
      },
      minecraft:{
        title:"Minecraft",type:"Sandbox",genre:"Sandbox / Survival",release:"2011",dev:"Mojang",platform:"PC",
        price:"$29.99",rating:4.9,players:"Solo or Online",modes:"Controller • KBM",
        tagline:"Build anything. Survive everything. Forever.",
        overview:"A limitless sandbox where you craft, mine, build, and survive. Create massive worlds, automate systems, or just chill and design something beautiful with friends.",
        bullets:["Creative and Survival modes","Endless building possibilities","Multiplayer servers","Mods + community creations"],
        imgs:["../assets/img/minecraft1.jpg","../assets/img/minecraft2.jpg","../assets/img/minecraft3.jpeg"]
      },
      "9kings":{
        title:"9 Kings",type:"Strategy",genre:"Strategy",release:"2024",dev:"Indie Studio",platform:"PC",
        price:"$11.99",rating:4.1,players:"Single-player",modes:"KBM",
        tagline:"Rule smart. Expand fast. Outplay the map.",
        overview:"A strategy-forward experience focused on smart expansion, calculated risk, and quick decisions. Build momentum, adapt to threats, and keep your kingdom stable.",
        bullets:["Fast strategy pacing","Meaningful upgrades","Replay-friendly runs","Decisions matter"],
        imgs:["../assets/img/9kings1.jpg","../assets/img/9kings2.png","../assets/img/9kings3.png"]
      },
      gemcraft:{
        title:"Gem Craft",type:"Tower Defense",genre:"Tower Defense",release:"2010",dev:"Game in a Bottle",platform:"PC",
        price:"$9.99",rating:4.4,players:"Single-player",modes:"KBM",
        tagline:"Precision builds, endless waves, pure dopamine.",
        overview:"A tower defense classic where gem combinations define your power. Tune builds, optimize routes, and survive escalating waves designed for theory-crafters.",
        bullets:["Deep upgrade system","Build experimentation","Endless wave challenge","High skill ceiling"],
        imgs:["../assets/img/gemcraft1.jpg","../assets/img/gemcraft2.jpg","../assets/img/gemcraft3.jpg"]
      },
      mariokartworlds:{
        title:"Mario Kart World",type:"Racing",genre:"Racing",release:"2025",dev:"Nintendo",platform:"Console / PC (TBD)",
        price:"$59.99",rating:4.6,players:"Local + Online",modes:"Controller",
        tagline:"Chaos, drift, and friendships you’ll test.",
        overview:"High-speed arcade racing with unpredictable items, tight drift lines, and wild track moments. Perfect for quick sessions or long rivalry nights.",
        bullets:["Arcade racing feel","Local + online play","Item chaos moments","Tracks built for drifting"],
        imgs:["../assets/img/mariokartworld1.png","../assets/img/mariokartworld2.jpg","../assets/img/mariokartworld3.jpg"]
      }
    };

    const normalizeId=(s)=>{
      const t=(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
      if(t==="9kings") return "9kings";
      if(t==="mariokartworlds"||t==="mariokartworld"||t==="mariokart") return "mariokartworlds";
      if(t==="gemcraft") return "gemcraft";
      if(t==="hollowknight") return "hollowknight";
      if(t==="minecraft") return "minecraft";
      if(t==="destiny2"||t==="destiny") return "destiny2";
      return t;
    };

    const isPlaceholderImagePath=(path)=>{
      const raw=String(path||"").trim().toLowerCase();
      return !raw||raw.includes("your-image-here")||raw.includes("replace-with-image")||raw.includes("placeholder");
    };
    const resolveStoreImage=(path)=>isPlaceholderImagePath(path)?"../assets/img/sale.png":String(path).trim();

    const loadPublisherGames=()=>{
      let records=[];
      try{records=JSON.parse(localStorage.getItem("games_v1")||"[]")}catch{records=[]}
      if(!Array.isArray(records)) return {};

      const mapped={};
      records.forEach((rec,index)=>{
        const key=normalizeId(rec&&rec.storeKey)||normalizeId(`pub${(rec&&rec.title)||"game"}${(rec&&rec.id)||index}`)||`pubgame${index+1}`;
        const priceNum=Number(rec&&rec.price);
        const price=Number.isFinite(priceNum)?`$${priceNum.toFixed(2)}`:"$0.00";
        const image=resolveStoreImage(rec&&rec.imagePath);
        const description=String((rec&&rec.description)||"Publisher listing.");
        const requirements=String((rec&&rec.requirements)||"Requirements not listed.");
        const releaseYear=new Date((rec&&rec.updatedAt)||Date.now()).getFullYear();
        mapped[key]={
          title:String((rec&&rec.title)||`Publisher Game ${index+1}`),
          type:String((rec&&rec.genre)||"Publisher Game")+" • Publisher",
          genre:String((rec&&rec.genre)||"Publisher Game"),
          release:Number.isFinite(releaseYear)?String(releaseYear):"2026",
          dev:String((rec&&rec.publisherName)||"Publisher"),
          platform:"PC",
          price,
          rating: 0,
          players:"Single-player",
          modes:"KBM",
          tagline:description,
          overview:description,
          bullets:[requirements],
          imgs:[image,image,image]
        };
      });
      return mapped;
    };

    const games={...STATIC_GAMES,...loadPublisherGames()};

    const id=normalizeId(gid),g=games[id]||games.destiny2;

    const $=id=>document.getElementById(id);

    $("gTitle").textContent=g.title;
    $("gTagline").textContent=g.tagline;
    $("pillType").textContent=g.type;
    $("pillPrice").textContent=g.price;
    $("priceBig").textContent=g.price;
    $("gStars").innerHTML=stars(g.rating);
    $("ratingBadge").textContent=`${g.rating.toFixed(1)} / 5`;
    $("gPlayers").textContent=g.players;
    $("gModes").textContent=g.modes;
    $("gOverview").textContent=g.overview;
    $("gGenre").textContent=g.genre;
    $("gRelease").textContent=g.release;
    $("gDev").textContent=g.dev;
    $("gPlatform").textContent=g.platform;
    const bulletsEl=$("gBullets");
    const bulletList=Array.isArray(g.bullets)?g.bullets.filter(Boolean):[];
    if(bulletsEl){
      bulletsEl.innerHTML=bulletList.map(t=>`<li class="flex gap-2"><span class="mt-[2px] text-accent">•</span><span>${t}</span></li>`).join("");
      const featuresCard=bulletsEl.closest(".rounded-2xl");
      if(featuresCard) featuresCard.classList.toggle("hidden",bulletList.length===0);
    }

    let idx=0,timer=null;

    const dots=()=>g.imgs.map((_,i)=>`<button data-dot="${i}" class="h-2 w-2 rounded-full ${i===idx?'bg-accent':'bg-white/20'} hover:bg-white/40 transition duration-200"></button>`).join("");

    const setImg=i=>{
      idx=(i+g.imgs.length)%g.imgs.length;
      $("heroImg").src=g.imgs[idx];
      $("imgDots").innerHTML=dots();
      document.querySelectorAll("[data-dot]").forEach(b=>b.addEventListener("click",()=>setImg(+b.dataset.dot)));
    };

    const auto=()=>{clearInterval(timer);timer=setInterval(()=>setImg(idx+1),5000);};

    setImg(0);auto();

    $("prevImg").onclick=()=>{setImg(idx-1);auto();};
    $("nextImg").onclick=()=>{setImg(idx+1);auto();};

    const addBtnTop=$("addBtnTop");
    const addBtn=$("addBtn");

    if (isPublisherViewOnly) {
      [addBtnTop, addBtn].forEach((btn) => {
        btn.textContent = "View only";
        btn.disabled = true;
        btn.classList.remove("bg-accent", "hover:brightness-110");
        btn.classList.add("border", "border-white/10", "bg-white/5", "text-white/80", "cursor-not-allowed");
      });
    } else {
      addBtnTop.onclick=()=>addToCart(id);
      addBtn.onclick=()=>addToCart(id);
    }

    const mini=k=>`<article class="reveal shine glass rounded-3xl p-5" data-tilt>
      <p class="text-xs tracking-widest text-white/60">RECOMMENDED</p>
      <h3 class="mt-2 text-lg font-semibold tracking-tight">${games[k].title}</h3>
      <p class="mt-1 text-sm text-white/70">${games[k].tagline}</p>
      <div class="mt-3 flex flex-wrap items-center gap-2 text-xs text-white/70">
        <span class="rounded-full border border-white/10 bg-white/5 px-3 py-1">${games[k].type}</span>
        <span class="flex items-center gap-1 rounded-full border border-white/10 bg-white/5 px-3 py-1">${stars(games[k].rating)}</span>
        <span class="ml-auto rounded-xl bg-accent px-3 py-1 font-semibold text-white">${games[k].price}</span>
      </div>
      <div class="mt-4 overflow-hidden rounded-2xl border border-white/10 bg-black/30">
        <img class="block h-40 w-full origin-top scale-[1.035] object-cover object-top transition duration-500 hover:scale-[1.06]" src="${games[k].imgs[0]}" alt="${games[k].title}" />
      </div>
      <div class="mt-4 flex items-center justify-between gap-3">
        <a href="details.html?id=${k}" class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm text-white/80 hover:bg-white/10 hover:text-white transition duration-200">Details</a>
        <button data-add="${k}" class="rounded-xl bg-accent px-4 py-2 text-sm font-semibold text-white hover:brightness-110 transition duration-200 active:scale-95">Add</button>
      </div>
    </article>`;

    const keys=Object.keys(games).filter(k=>k!==id).slice(0,3);
    moreWrap.innerHTML=keys.map(mini).join("");

    document.querySelectorAll("[data-add]").forEach((b)=>{
      if (isPublisherViewOnly) {
        b.textContent = "View only";
        b.disabled = true;
        b.classList.remove("bg-accent", "hover:brightness-110");
        b.classList.add("border", "border-white/10", "bg-white/5", "text-white/80", "cursor-not-allowed");
        return;
      }
      b.onclick=()=>addToCart(b.dataset.add);
    });

    const glow=document.getElementById("cursorGlow");
    addEventListener("mousemove",e=>{glow.style.left=e.clientX+"px";glow.style.top=e.clientY+"px"},{passive:true});

    const setVars=(el,e)=>{const r=el.getBoundingClientRect(); el.style.setProperty("--mx",(e.clientX-r.left)+"px"); el.style.setProperty("--my",(e.clientY-r.top)+"px");};

    const tilt=(el,e)=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      el.style.transform=`perspective(900px) rotateX(${(-y*6).toFixed(2)}deg) rotateY(${(x*8).toFixed(2)}deg) translateZ(0)`;};

    document.querySelectorAll("[data-tilt]").forEach(el=>{
      el.addEventListener("mousemove",e=>{setVars(el,e);tilt(el,e)},{passive:true});
      el.addEventListener("mouseleave",()=>{el.style.transform="perspective(900px) rotateX(0) rotateY(0)";});
    });

    const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add("in")),{threshold:.12});
    document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

    (function() {
      var btn = document.getElementById("mobileNavBtn");
      var nav = btn && btn.closest("header").querySelector("nav.ml-2");
      if (!btn || !nav) return;
      btn.addEventListener("click", function(e) {
        e.stopPropagation();
        nav.classList.toggle("mob-open");
        btn.textContent = nav.classList.contains("mob-open") ? "✕" : "☰";
      });
      document.addEventListener("click", function(e) {
        if (!nav.contains(e.target) && e.target !== btn) {
          nav.classList.remove("mob-open");
          btn.textContent = "☰";
        }
      });
    })();
  </script>
</body>
</html>
