<!doctype html>
<!-- This line tells the browser this file is using modern HTML (HTML5) so it knows how to interpret the tags correctly -->

<html lang="en">
<!-- This is the root element that wraps the entire page -->
<!-- lang="en" means the main language is English -->

<head>
  <!-- This is where you put all your set up (non visible) info -->
  <!-- Metadata, page title, fonts, css frameworks, and scripts -->

  <meta charset="UTF-8" />
  <!-- Makes all symbols work correctly -->

  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Makes the page work correctly on a mobile device -->

  <title>PC+ | Login</title>
  <!-- The title of your page (what shows on the browser tab) -->

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Imports the Tailwind CSS framework -->
  <!-- All very specific colors and UI elements will come from this framework! -->

  <script>
    // You can extend its base package with your own UI changes!
    // This lets us create our own colors and themes to use inside our web pages!
    // All the UI design will live inside this file
    // This is not universal since its client side only!

    tailwind.config={theme:{extend:{colors:{
      // Custom colors for the PC+ theme background and panels
      teal0:"#041a1a",teal1:"#062626",teal2:"#083535",teal3:"#0b4747",

      // Generally, make it frosted-glass looking
      panel:"rgba(255,255,255,.06)",stroke:"rgba(255,255,255,.10)",accent:"#ff7a18"
    }}}}
  </script>

  <!-- The following import allows us to import google fonts for all text on our page -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <!-- Connecting with the font to make it faster when the page loads -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Preconnect to the domain our font files live on -->
  <!-- Cross origin allowed by default for a font import -->

  <link href="https://fonts.googleapis.com/css2?family=Yuji+Mai&display=swap" rel="stylesheet" />
  <!-- Import Yuji Mai font (it'll be the heading font for this page) -->

  <style>
    :root { --mx: 0; --my: 0; }

    html { background: #041a1a; overscroll-behavior: none; }

    body {
      font-family: "Yuji Mai", system-ui, sans-serif;
      letter-spacing: .35px;
      background:
        radial-gradient(1200px 700px at 15% 20%, rgba(255,122,24,.18), transparent 55%),
        radial-gradient(900px 600px at 85% 35%, rgba(0,255,200,.10), transparent 60%),
        linear-gradient(120deg, #041a1a, #083535, #062626, #0b4747);
      background-size: 100% 100%, 100% 100%, 300% 300%;
      animation: bg 14s ease-in-out infinite alternate;
    }

    @keyframes bg {
      0%   { background-position: 0 0, 0 0, 0% 50%; }
      100% { background-position: 0 0, 0 0, 100% 50%; }
    }

    /* Glass card */
    .glass {
      background: linear-gradient(160deg, rgba(255,255,255,.11), rgba(255,255,255,.05));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.12);
      transition: border-color .22s, box-shadow .22s, transform .22s;
    }
    .glass:hover {
      border-color: rgba(255,255,255,.2);
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
    }

    /* Shine overlay */
    .shine { position: relative; overflow: hidden; }
    .shine:before {
      content: "";
      position: absolute;
      inset: -2px;
      opacity: 0;
      transition: opacity .18s;
      pointer-events: none;
      background: radial-gradient(100px 100px at var(--mx) var(--my), rgba(255,255,255,.10), transparent 70%);
    }
    .shine:hover:before { opacity: .25; }

    /* Scroll-reveal animation */
    .reveal {
      opacity: 0;
      transform: translateY(12px) scale(.98);
      filter: blur(5px);
    }
    .reveal.in {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
      transition: opacity .65s cubic-bezier(.4,0,.2,1),
                  transform .65s cubic-bezier(.4,0,.2,1),
                  filter .65s cubic-bezier(.4,0,.2,1);
    }

    /* Mobile hamburger nav */
    #mobileNavBtn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 38px; height: 38px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
      transition: background .18s;
    }
    #mobileNavBtn:hover { background: rgba(255,255,255,.14); }

    /* On small screens: hide nav links by default, show hamburger */
    @media (max-width: 639px) {
      #mobileNavBtn { display: flex; }

      nav.ml-2 {
        position: absolute;
        top: 100%;
        left: 0; right: 0;
        flex-direction: column;
        align-items: stretch;
        background: rgba(4, 20, 20, 0.97);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255,255,255,.10);
        padding: 8px 12px 12px;
        gap: 3px;
        z-index: 48;
        animation: navDown .2s ease both;
        display: none;
      }
      nav.ml-2.mob-open { display: flex; }

      nav.ml-2 a {
        padding: 11px 14px !important;
        border-radius: 14px !important;
        font-size: 15px !important;
        width: 100%;
      }

      /* Hide desktop search in nav, show icon button only */
      nav.ml-2 .ml-auto { display: none; }
      #mobileSearchBtn { display: flex !important; }
    }

    @keyframes navDown {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="min-h-screen text-white selection:bg-accent/30 selection:text-white">
  <!-- Page body using Tailwind, adds colors and heights -->

  <div id="cursorGlow" class="pointer-events-none fixed left-0 top-0 rounded-full"
       style="width:0.12rem;height:0.12rem;opacity:0.035;filter:blur(2px);transform:translate(-50%,-50%);
              background:radial-gradient(circle,rgba(255,122,24,.55),rgba(0,255,200,.25),transparent 72%);"></div>
  <!-- A small white glow that follows your mouse around -->
  <!-- Globally position the glow using CSS -->
  <!-- Don't get in the way of mouse inputs (clicks, scrolls etc.) -->
  <!-- Center align dot based on mouse position -->

  <header class="sticky top-0 z-50 border-b border-white/10 bg-black/20 backdrop-blur-xl" style="position:relative;">
    <!-- Create a sticky navigation bar -->
    <!-- Make sure it's on top of everything else -->
    <!-- Sticky so stuff scrolls behind it -->

    <div class="mx-auto flex max-w-7xl items-center gap-4 px-5 py-4">
      <!-- A flexbox container for all navigation bar elements -->
      <!-- Adds a gap between the logo and navigation elements -->
      <!-- Adds padding (space) around all navigation bar elements -->

      <a class="font-semibold tracking-tight hover:text-white/90 transition duration-200" href="customer-home.html">PC<span class="text-accent">+</span></a>
      <!-- Add logo and home link to navigation bar (plus sign has its own style) -->

      <nav class="ml-2 flex flex-1 items-center gap-1 text-sm text-white/80">
        <!-- Add navigation links using flexbox! (spaced elements) -->
        <!-- Make the nav take up remaining space -->
        <!-- All navigation links have muted colors except the plus sign -->

        <a id="navHome" class="rounded-2xl px-3 py-2 hover:bg-white/5 hover:text-white transition duration-200" href="customer-home.html">Home</a>
        <a id="navLibrary" class="rounded-2xl px-3 py-2 hover:bg-white/5 hover:text-white transition duration-200" href="library.html">Library</a>
        <a id="navCart" class="rounded-2xl px-3 py-2 hover:bg-white/5 hover:text-white transition duration-200" href="cart.html">Cart</a>
        <a id="navProfile" class="hidden rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition duration-200" href="profile.html">Profile</a>
        <a id="navLogin" class="rounded-2xl px-3 py-2 bg-white/10 text-white transition" href="login.html">Login</a>
        <a id="navPubDashboard" class="hidden rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition duration-200" href="../publisher/dashboard.html">Dashboard</a>
        <a id="navPubManage" class="hidden rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition duration-200" href="../publisher/manage-games.html">Manage Games</a>
        <a id="navPubUpload" class="hidden rounded-lg px-3 py-2 hover:bg-white/5 hover:text-white transition duration-200" href="../publisher/upload-game.html">Upload Game</a>

        <div class="ml-auto hidden sm:flex items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-3 py-2">
          <!-- Add a simple search bar UI element to the right-hand side -->
          <!-- Push the search bar all the way to the right -->
          <!-- Hidden on tiny screens only show on small devices up -->

          <svg class="h-4 w-4 text-white/70" viewBox="0 0 24 24" fill="none">
            <!-- Icons are SVGs so they scale well -->
            <path d="M21 21l-4.3-4.3m1.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>

          <input id="searchBox" class="w-56 bg-transparent text-sm outline-none placeholder:text-white/40" placeholder="Search games..." />
          <!-- Input field, no javascript it is just visual here -->
        </div>
      </nav>

      <button id="mobileNavBtn" aria-label="Toggle navigation">☰</button>
    </div>
  </header>

  <main class="relative z-10 mx-auto max-w-7xl px-4 sm:px-5 pb-20 pt-8 sm:pt-10">
    <!-- Main content container for page (allows for multiple pages) -->
    <!-- Keep content relatively positioned to the background layers -->
    <!-- Limit content width using Tailwind -->
    <!-- Add padding to main content container -->
    <!-- Add padding for below elements (so header not jammed up against content) -->

    <div class="mx-auto max-w-xl">
      <!-- Makes sure all content is center aligned including text! -->

      <h1 class="text-3xl sm:text-4xl font-semibold tracking-tight">Account Access</h1>
      <!-- Main heading for your home page (store name) -->

      <p id="statusLine" class="mt-2 text-white/70 text-sm"></p>
      <!-- Status line, filled by javascript (who you signed in as) -->

      <div class="mt-6 glass rounded-3xl p-5 shine" data-tilt>
        <!-- A large card container for login/signup/forgot password UI container -->
        <!-- Make card have a frosted glass look -->
        <!-- Round its edges by quite a bit! -->
        <!-- Give it some padding for space!! -->
        <!-- The shiny overlay that appears on hover -->
        <!-- JavaScript attribute to tilt/shake card when mouse moves across it -->

        <div class="flex items-center gap-2 rounded-2xl border border-white/10 bg-white/5 p-2">
          <!-- Add tabs to login/signup/forgot password user input interface! -->
          <!-- Make tab section look like a pill container with smaller rounded edges -->
          <!-- Each tab looks like a button where one will be active at any time! -->

          <button id="tabLogin" class="flex-1 rounded-xl px-4 py-2 text-sm transition bg-white/10 text-white">Login</button>
          <!-- Make both tabs take equal space -->
          <!-- Make login tab currently "active" -->

          <button id="tabSignup" class="flex-1 rounded-xl px-4 py-2 text-sm transition hover:bg-white/10 text-white/80">Sign up</button>
          <!-- Inactive so only white /80 meaning less bright than active one.. -->
        </div>

        <p id="msg" class="mt-4 text-sm text-white/70"></p>
        <!-- Make all messages appear in this section (success/error/notifications) -->
        <div class="mt-3 rounded-2xl border border-white/10 bg-white/5 p-3 text-xs text-white/75">
          Demo Accounts:
          customer / customer (PIN: 0000)
          and
          publisher / publisher (PIN: 0000)
        </div>

        <div id="panelLogin" class="mt-4 space-y-3">
          <!-- Only login panel visible by default -->
          <!-- Add vertical space between all buttons and input fields! -->

          <input id="loginEmail" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm outline-none placeholder:text-white/40 focus:border-white/20" placeholder="Email" />
          <!-- Input field for email id on login panel -->
          <!-- Make sure input takes up full space of login panel! -->

          <input id="loginPass" type="password" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm outline-none placeholder:text-white/40 focus:border-white/20" placeholder="Password" />
          <!-- Get the password input field as well -->
          <!-- Make password character hidden during typing -->

          <button id="btnLogin" class="w-full rounded-2xl bg-accent px-5 py-3 text-sm font-semibold text-white hover:brightness-110 transition duration-200">Login</button>
          <!-- Login submit button! -->
          <!-- Looks like a button with orange color but does not have functionality -->

          <button id="showForgot" class="w-full rounded-2xl border border-white/10 bg-white/5 px-5 py-3 text-sm text-white/80 hover:bg-white/10 hover:text-white transition duration-200">Forgot my password</button>
          <!-- Button to toggle on the forgot password panel -->
        </div>

        <div id="panelSignup" class="mt-4 space-y-3 hidden">
          <!-- Sign up panel starts off hidden -->
          <!-- Makes it visible when you click sign up tab -->

          <input id="signEmail" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm outline-none placeholder:text-white/40 focus:border-white/20" placeholder="Email" />
          <!-- Input field for creating account (uses same email format) -->

          <input id="signPass" type="password" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm outline-none placeholder:text-white/40 focus:border-white/20" placeholder="Password" />
          <!-- Password input field (creating account) -->

          <select id="signRole" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm outline-none focus:border-white/20">
            <option value="customer">Customer account</option>
            <option value="publisher">Publisher account</option>
          </select>

          <input id="signPin" inputmode="numeric" maxlength="4" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm outline-none placeholder:text-white/40 focus:border-white/20" placeholder="4-digit security PIN" />

          <button id="btnSignup" class="w-full rounded-2xl bg-accent px-5 py-3 text-sm font-semibold text-white hover:brightness-110 transition duration-200">Create account</button>
          <!-- Save account info to local storage for class project/demo -->
        </div>

        <div id="panelForgot" class="mt-4 space-y-3 hidden">
          <input id="forgotEmail" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm outline-none placeholder:text-white/40 focus:border-white/20" placeholder="Email" />
          <input id="forgotPin" inputmode="numeric" maxlength="4" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm outline-none placeholder:text-white/40 focus:border-white/20" placeholder="4-digit security PIN" />
          <input id="newPass" type="password" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm outline-none placeholder:text-white/40 focus:border-white/20" placeholder="New password" />
          <button id="btnReset" class="w-full rounded-2xl bg-accent px-5 py-3 text-sm font-semibold text-white hover:brightness-110 transition duration-200">Save new password</button>
          <button id="backToLogin" class="w-full rounded-2xl border border-white/10 bg-white/5 px-5 py-3 text-sm text-white/80 hover:bg-white/10 hover:text-white transition duration-200">Back</button>
        </div>

        <div id="loginSuccessCard" class="mt-4 hidden">
          <div class="rounded-2xl border border-white/10 bg-white/5 p-5 text-center">
            <h3 class="mt-3 text-lg font-semibold">Logged in successfully</h3>
            <p class="mt-1 text-sm text-white/70">Manage profile, avatar, and account type in your Profile page.</p>
          </div>
        </div>

        <div class="mt-5 flex items-center justify-between gap-3">
          <a href="customer-home.html" class="rounded-2xl border border-white/10 bg-white/5 px-5 py-3 text-sm text-white/80 hover:bg-white/10 hover:text-white transition duration-200">Back to Home</a>
          <button id="btnLogout" class="rounded-2xl border border-white/10 bg-white/5 px-5 py-3 text-sm text-white/80 hover:bg-white/10 hover:text-white transition hidden">Log out</button>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    const glow = document.getElementById("cursorGlow");
    addEventListener("mousemove", (e) => {
      glow.style.left = e.clientX + "px";
      glow.style.top = e.clientY + "px";
    }, { passive: true });

    const setVars = (el, e) => {
      const r = el.getBoundingClientRect();
      el.style.setProperty("--mx", (e.clientX - r.left) + "px");
      el.style.setProperty("--my", (e.clientY - r.top) + "px");
    };

    const tilt = (el, e) => {
      const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = `perspective(900px) rotateX(${(-y * 6).toFixed(2)}deg) rotateY(${(x * 8).toFixed(2)}deg) translateZ(0)`;
    };

    document.querySelectorAll("[data-tilt]").forEach((el) => {
      el.addEventListener("mousemove", (e) => {
        setVars(el, e);
        tilt(el, e);
      }, { passive: true });
      el.addEventListener("mouseleave", () => {
        el.style.transform = "perspective(900px) rotateX(0) rotateY(0)";
      });
    });

    const msg = (t, ok = false) => {
      const el = document.getElementById("msg");
      el.textContent = t || "";
      el.className = "mt-4 text-sm " + (ok ? "text-emerald-200" : "text-white/70");
    };

    const session = () => (window.PCPlusAuth ? window.PCPlusAuth.getSession() : null);
    const normEmail = (e) => (e || "").trim().toLowerCase();
    const getAvatarEmoji = (email) => (window.PCPlusAuth ? window.PCPlusAuth.getAvatarEmoji(email) : "🦊");

    const navProfile = document.getElementById("navProfile");
    const nav = document.getElementById("navLogin");
    const navRoot = nav ? nav.closest("nav") : null;
    const navSearchWrap = navRoot ? navRoot.querySelector(".ml-auto") : null;
    const searchBox = document.getElementById("searchBox");
    const runHomeSearchRedirect = () => {
      const q = (searchBox?.value || "").trim();
      location.href = q ? `customer-home.html?q=${encodeURIComponent(q)}` : "customer-home.html";
    };
    if (searchBox) {
      searchBox.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        runHomeSearchRedirect();
      });
    }
    const navHome = document.getElementById("navHome");
    const navLibrary = document.getElementById("navLibrary");
    const navCart = document.getElementById("navCart");
    const navPubDashboard = document.getElementById("navPubDashboard");
    const navPubManage = document.getElementById("navPubManage");
    const navPubUpload = document.getElementById("navPubUpload");
    const pubLinks = [
      navPubDashboard,
      navPubManage,
      navPubUpload
    ];

    const orderNav = (items) => {
      if (!navRoot) return;
      const frag = document.createDocumentFragment();
      items.forEach((el) => {
        if (!el) return;
        frag.appendChild(el);
      });
      if (navSearchWrap) navRoot.insertBefore(frag, navSearchWrap);
      else navRoot.appendChild(frag);
    };

    const statusLine = document.getElementById("statusLine");
    const btnLogout = document.getElementById("btnLogout");
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const panelLogin = document.getElementById("panelLogin");
    const panelSignup = document.getElementById("panelSignup");
    const panelForgot = document.getElementById("panelForgot");
    const loginSuccessCard = document.getElementById("loginSuccessCard");

    const signEmail = document.getElementById("signEmail");
    const signPass = document.getElementById("signPass");
    const signRole = document.getElementById("signRole");
    const signPin = document.getElementById("signPin");
    const forgotEmail = document.getElementById("forgotEmail");
    const forgotPin = document.getElementById("forgotPin");
    const newPass = document.getElementById("newPass");

    const authErrorText = (code) => {
      const map = {
        invalid_email: "Please enter a valid email.",
        invalid_password: "Please enter a valid password.",
        invalid_role: "Please choose a valid account type.",
        invalid_pin: "PIN must be exactly 4 digits.",
        email_taken: "That email is already used by another account.",
        account_not_found: "No account found for that email.",
        pin_mismatch: "PIN does not match that account.",
        invalid_credentials: "That is not a correct username/password combination."
      };
      return map[code] || "Something went wrong. Please try again.";
    };

    const setSignedInTabs = (signedIn) => {
      if (signedIn) {
        tabSignup.classList.add("hidden");
        tabLogin.className = "flex-1 rounded-xl px-4 py-2 text-sm transition bg-white/10 text-white";
      } else {
        tabSignup.classList.remove("hidden");
      }
    };

    const showLoginCard = () => {
      panelLogin.classList.remove("hidden");
      panelSignup.classList.add("hidden");
      panelForgot.classList.add("hidden");
      loginSuccessCard.classList.add("hidden");
      tabLogin.className = "flex-1 rounded-xl px-4 py-2 text-sm transition bg-white/10 text-white";
      tabSignup.className = "flex-1 rounded-xl px-4 py-2 text-sm transition hover:bg-white/10 text-white/80";
      setSignedInTabs(false);
    };

    const showLoggedInCard = () => {
      panelLogin.classList.add("hidden");
      panelSignup.classList.add("hidden");
      panelForgot.classList.add("hidden");
      loginSuccessCard.classList.remove("hidden");
      tabLogin.className = "flex-1 rounded-xl px-4 py-2 text-sm transition bg-white/10 text-white";
      setSignedInTabs(true);
    };

    const renderTopNav = () => {
      const s = session();
      const signedIn = !!(s && s.email);
      const isPublisher = !!(s && s.role === "publisher");

      if (navLibrary) navLibrary.classList.toggle("hidden", isPublisher);
      if (navCart) navCart.classList.toggle("hidden", isPublisher);
      pubLinks.forEach((el) => {
        if (el) el.classList.toggle("hidden", !isPublisher);
      });
      if (navSearchWrap) navSearchWrap.classList.toggle("hidden", isPublisher);

      if (!nav) return;
      if (navProfile) {
        navProfile.classList.toggle("hidden", !signedIn);
        navProfile.href = "profile.html";
      }
      nav.classList.remove("hidden");
      nav.href = "login.html";
      nav.textContent = signedIn ? `Logged in ${getAvatarEmoji(s.email)}` : "Login";

      if (isPublisher) {
        orderNav(signedIn
          ? [navHome, navPubDashboard, navPubManage, navPubUpload, navProfile, nav]
          : [navHome, navPubDashboard, navPubManage, navPubUpload, nav]);
      } else {
        orderNav(signedIn
          ? [navHome, navLibrary, navCart, navProfile, nav]
          : [navHome, navLibrary, navCart, nav]);
      }
    };

    const refreshNav = () => {
      const s = session();
      renderTopNav();
      statusLine.textContent = (s && s.email) ? `Logged in as ${s.email} (${s.role}).` : "Not signed in yet.";
      btnLogout.classList.toggle("hidden", !(s && s.email));
      if (s && s.email) showLoggedInCard();
      else showLoginCard();
    };

    refreshNav();

    const authNotice = window.PCPlusAuth ? window.PCPlusAuth.consumeNotice() : "";
    if (authNotice) msg(authNotice);

    const show = (which) => {
      const s = session();
      if (s && s.email) return;
      panelLogin.classList.toggle("hidden", which !== "login");
      panelSignup.classList.toggle("hidden", which !== "signup");
      panelForgot.classList.toggle("hidden", which !== "forgot");
      tabLogin.className = "flex-1 rounded-xl px-4 py-2 text-sm transition " + (which === "login" ? "bg-white/10 text-white" : "hover:bg-white/10 text-white/80");
      tabSignup.className = "flex-1 rounded-xl px-4 py-2 text-sm transition " + (which === "signup" ? "bg-white/10 text-white" : "hover:bg-white/10 text-white/80");
      msg("");
    };

    tabLogin.onclick = () => show("login");
    tabSignup.onclick = () => show("signup");
    document.getElementById("showForgot").onclick = () => show("forgot");
    document.getElementById("backToLogin").onclick = () => show("login");
    function setBtn(btn, loading, label) {
      btn.disabled = loading;
      btn.textContent = loading ? label : btn.dataset.label || btn.textContent;
      if (!btn.dataset.label && !loading) btn.dataset.label = btn.textContent;
    }

    document.getElementById("btnSignup").onclick = async () => {
      const btn = document.getElementById("btnSignup");
      const payload = {
        email: normEmail(signEmail.value),
        password: signPass.value || "",
        role: signRole.value || "customer",
        pin: (signPin.value || "").trim()
      };
      setBtn(btn, true, "Creating account…");
      try {
        const result = window.PCPlusAuth ? await window.PCPlusAuth.signup(payload) : { ok: false };
        if (!result.ok) { setBtn(btn, false); return msg(authErrorText(result.error)); }
        refreshNav();
        msg("Account created and logged in successfully.", true);
      } finally { setBtn(btn, false); }
    };

    document.getElementById("btnReset").onclick = async () => {
      const btn = document.getElementById("btnReset");
      const payload = {
        email: normEmail(forgotEmail.value),
        pin: (forgotPin.value || "").trim(),
        newPassword: newPass.value || ""
      };
      setBtn(btn, true, "Saving…");
      try {
        const result = window.PCPlusAuth ? await window.PCPlusAuth.resetPassword(payload) : { ok: false };
        if (!result.ok) { setBtn(btn, false); return msg(authErrorText(result.error)); }
        msg("Password updated. Please log in with your new password.", true);
        show("login");
      } finally { setBtn(btn, false); }
    };

    const runLogin = async () => {
      const btn = document.getElementById("btnLogin");
      const email = normEmail(document.getElementById("loginEmail").value);
      const pass = document.getElementById("loginPass").value || "";
      setBtn(btn, true, "Logging in…");
      try {
        const result = window.PCPlusAuth ? await window.PCPlusAuth.login(email, pass) : { ok: false };
        if (!result.ok) { setBtn(btn, false); return msg(authErrorText(result.error)); }
        refreshNav();
        msg("Logged in successfully.", true);
      } finally { setBtn(btn, false); }
    };
    document.getElementById("btnLogin").onclick = runLogin;

    ["loginEmail", "loginPass"].forEach((id) => {
      const input = document.getElementById(id);
      if (!input) return;
      input.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        if (panelLogin.classList.contains("hidden")) return;
        e.preventDefault();
        runLogin();
      });
    });

    btnLogout.onclick = () => {
      localStorage.removeItem("pcplus_library");
      localStorage.removeItem("pcplus_cart");
      localStorage.removeItem("pcplus_discount");
      if (window.PCPlusAuth) window.PCPlusAuth.logout();
      refreshNav();
      msg("Logged out. Library cleared.", true);
    };

    // Mobile nav toggle
    (function() {
      var btn = document.getElementById("mobileNavBtn");
      var nav = btn && btn.closest("header").querySelector("nav.ml-2");
      if (!btn || !nav) return;
      btn.addEventListener("click", function(e) {
        e.stopPropagation();
        nav.classList.toggle("mob-open");
        btn.textContent = nav.classList.contains("mob-open") ? "✕" : "☰";
      });
      document.addEventListener("click", function(e) {
        if (!nav.contains(e.target) && e.target !== btn) {
          nav.classList.remove("mob-open");
          btn.textContent = "☰";
        }
      });
    })();
  </script>
</body>
</html>
