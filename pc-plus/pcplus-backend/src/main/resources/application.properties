spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool — tuned for Neon's serverless behavior
# (Neon "sleeps" when idle; these settings keep connections alive)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ----- JPA / Hibernate ------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# "update" = Hibernate auto-creates/alters tables on startup.
# Leave as "update" for development.
spring.jpa.hibernate.ddl-auto=update

# Set to true temporarily if you want to see every SQL query in the console
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ----- Server ---------------------------------------------
server.port=8080

# ----- CORS -----------------------------------------------
# This is the origin the browser sends when loading the frontend.
# If opening HTML files directly (file://), browsers send Origin: null.
# If using a local server (python3 -m http.server 3000), use http://localhost:3000.
# If using VS Code Live Server (port 5500), use http://localhost:5500.
# You can change this to match wherever your frontend is served from.
pcplus.cors.allowed-origin=http://localhost:3000

# ----- JWT ------------------------------------------------
# IMPORTANT: Change this to a long random string before any real deployment.
# For this class project it's fine as-is.
pcplus.jwt.secret=PCPlusSecretKey_ChangeThisInProduction_CSC340_Group4_2026
pcplus.jwt.expiration-ms=86400000

# ----- Logging --------------------------------------------
# Set to DEBUG to see all SQL + auth events during development
logging.level.com.pcplus=DEBUG
logging.level.org.springframework.security=WARN
# Uncomment the line below to see every SQL statement Hibernate runs:
# logging.level.org.hibernate.SQL=DEBUG
